# Clippy config for `scripts/check-no-run-blocking.sh` (gate `G-nb`), loaded via
# `CLIPPY_CONF_DIR`. It is NOT the workspace clippy config: normal `cargo clippy` never reads it.
#
# Library code must not park a thread on an effect: that blocks an executor worker, deadlocks a
# current-thread runtime, and hides the effect from interruption. Run effects with `.await`
# (`Runtime::run`, `run_async`) or hand them to the caller. Only a program edge (a `main`, a CLI
# entry point) may block; mark that one call site with
# `#[allow(clippy::disallowed_methods, reason = "edge: ...")]`.
#
# Tests, benches and examples are not checked: the script lints `--lib` only.
#
# Paths are the DEFINITION paths (private modules included): clippy does not resolve a method
# through the glob re-exports (`id_effect::next::Effect` is `next::kernel::effect::Effect`).
# When a type moves (e.g. `k-retire-v1` promoting `next` to the root), update these; the script
# fails while any entry "does not refer to a reachable function".

disallowed-methods = [
  # v1 kernel (retired by `k-retire-v1`).
  { path = "id_effect::runtime::execute::run_blocking", reason = "v1 `run_blocking` parks the thread; `.await` `run_async` or return the effect (G-nb)" },
  # `next` kernel run edges.
  { path = "id_effect::next::kernel::effect::Effect::block_on", reason = "`next` `Effect::block_on` parks the thread; `.await` `Runtime::run` or return the effect (G-nb)" },
  { path = "id_effect::next::kernel::effect::Effect::try_block_on", reason = "`next` `Effect::try_block_on` parks the thread; `.await` `Runtime::run` or return the effect (G-nb)" },
  { path = "id_effect::next::runtime::runtime::Runtime::block_on", reason = "`next` `Runtime::block_on` parks the thread; `.await` `Runtime::run` or return the effect (G-nb)" },
  { path = "id_effect::next::runtime::runtime::Runtime::try_block_on", reason = "`next` `Runtime::try_block_on` parks the thread; `.await` `Runtime::run` or return the effect (G-nb)" },
  { path = "id_effect::next::runtime::runtime::Runtime::block_on_future", reason = "`next` `Runtime::block_on_future` parks the thread; `.await` the future (G-nb)" },
]
