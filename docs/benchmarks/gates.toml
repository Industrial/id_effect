# D9 benchmark gates for 0.7 against the v0.6 baseline (see README.md).
#
# Read by scripts/bench-compare.sh, which supports only this flat subset of TOML:
# top-level `key = value` lines, then `[[gate]]` tables with `id`, `kind`, `limit`, an
# optional `noise` that overrides the global band for that gate and, for `pair` and `delta`,
# `over`.
#
# ratio = new / base on `metric` (time per iteration, so lower is better).
#   kind = "budget"   passes when ratio <= limit
#   kind = "improve"  passes when ratio <  limit
#   kind = "pair"     ratio = new[id] / new[over], one run (no base); passes when ratio <= limit
#   kind = "delta"    diff = new[id] - new[over] in the metric's unit (ns), one run (no base);
#                     passes when diff <= limit; only its own `noise` (ns) applies; the ratio
#                     is printed for information
#   kind = "report"   never fails on its ratio; listed so its presence is required
# A ratio that misses its limit by at most `noise` (absolute) is NOISE, not FAIL (Q7).
# Every listed id must exist in both files (a pair's or delta's id and `over` in the new one); a
# missing id is a FAIL.

metric = "median"
noise = 0.05

# --- bind/map hot path: may regress by at most 25 % ---------------------------------

[[gate]]
id = "phase0/bench_effect_map_chain"
kind = "budget"
limit = 1.25

[[gate]]
id = "phase0/bench_effect_flat_map_chain"
kind = "budget"
limit = 1.25

[[gate]]
id = "gate/flat_map_depth_10k"
kind = "budget"
limit = 1.25

[[gate]]
id = "gate/async_bind_64"
kind = "budget"
limit = 1.25

# --- 0.7 regressions fixed in 0.8 (E2.1h, REPORT-0.8.md): budget against v0.6 ------------
# The queue and channel hand-off may cost at most 25 % more than v0.6, a count-only retry at
# most twice v0.6.

[[gate]]
id = "coord/channel_spsc_10k"
kind = "budget"
limit = 1.25

[[gate]]
id = "coord/queue_bounded_10k"
kind = "budget"
limit = 1.25

[[gate]]
id = "phase0/bench_schedule_retry_overhead"
kind = "budget"
limit = 2.0

# --- fibers and the axum request path: must improve ----------------------------------
# "Improve" means a ratio below 0.95 with no noise band (r-bench-report ruling): a
# same-speed or noise-level result is not an improvement, so it FAILs.

[[gate]]
id = "gate/spawn_join_10k"
kind = "improve"
limit = 0.95
noise = 0

[[gate]]
id = "gate/sleep_cpu_1k_x_1ms"
kind = "improve"
limit = 0.95
noise = 0

[[gate]]
id = "gate/axum_request_oneshot"
kind = "improve"
limit = 0.95
noise = 0

# --- secure-stack overhead (0.11 KPI, E2.6): one run, no noise band ------------------
# The recommended production stack in front of the axum request may cost at most 5 us (5000 ns)
# per request over the same request without it (benches/gate_request.rs in id_effect_axum).
# An absolute budget, not a ratio (owner decision 2026-10-19): the bare request is under 1 us,
# so a ratio would leave almost nothing for the stack's real per-request work.

[[gate]]
id = "gate/axum_request_secure_stack"
kind = "delta"
over = "gate/axum_request_bare"
limit = 5000
noise = 0

# --- RPC (0.12 T12, r12-e12-5-benches): one run, ratios only between two measurements of the
# same stack (README "RPC gates (0.12)") ----------------------------------------------------

# 50 calls in one batch must be at least 5x faster than the same 50 calls awaited one after the
# other, over one loopback HTTP/1.1 keep-alive connection (benches/gate_rpc.rs).
[[gate]]
id = "rpc/batch_50"
kind = "pair"
over = "rpc/sequential_50"
limit = 0.20
noise = 0

# D9: HTTP/3 p99 at most HTTP/2 p99 under 1 % loss + 5 ms, 64 multiplexed 16 KiB responses on
# one connection, the shipped host (BBR on the h3 route). Measured under `tc netem` in
# bench.yml (benches/h3_loss.rs).
[[gate]]
id = "h3_loss/h3_p99"
kind = "pair"
over = "h3_loss/h2_p99"
limit = 1.00
noise = 0.05

# --- report only ---------------------------------------------------------------------

[[gate]]
id = "gate/sleep_1k_x_1ms"
kind = "report"

[[gate]]
id = "gate/axum_request_caps"
kind = "report"

[[gate]]
id = "stream/pull_map_10k"
kind = "report"

[[gate]]
id = "stream/map_effect_1k"
kind = "report"
