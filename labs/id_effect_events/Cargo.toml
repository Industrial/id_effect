[package]
publish = false
name = "id_effect_events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Event sourcing, projections, and CQRS boundaries for id_effect programs"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["event-sourcing", "cqrs", "projection", "event-store"]
categories = ["data-structures"]

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dependencies]
id_effect = { path = "../../crates/id_effect", version = "0.6.0", features = [
  "schema-serde",
] }
id_effect_graph = { path = "../id_effect_graph", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
rstest = "0.26"
tempfile = "3"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "time"] }

[features]
default = []
es-entity = ["dep:sqlx", "dep:id_effect_sql", "id_effect_sql/pg", "dep:tokio", "dep:es-entity"]

[dependencies.sqlx]
version = "0.8"
default-features = false
features = ["runtime-tokio", "postgres"]
optional = true

[dependencies.id_effect_sql]
path = "../../crates/id_effect_sql"
version = "0.6.0"
optional = true

[dependencies.es-entity]
version = "0.10.40"
optional = true

[dependencies.tokio]
version = "1.50.0"
features = ["rt"]
optional = true

[[test]]
name = "es_entity_journal"
required-features = ["es-entity"]

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "labs"
