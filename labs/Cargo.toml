# Labs workspace (ADR 0010, Amendment 1): unpublished crates with no API guarantees.
# Kept separate from the main workspace so main CI never builds their deps. Built by the CI
# `labs` job:
#   cargo nextest run --manifest-path labs/Cargo.toml --workspace --all-features
# id_effect_workflow left labs in 0.11: it is the published crates/id_effect_workflow.
[workspace]
resolver = "2"
exclude = ["id_effect_lint"]                                   # nightly-only Dylint crate; builds standalone
members = ["id_effect_ai", "id_effect_parse", "id_effect_rpc"]

# Keep in lockstep with the root [workspace.package].
[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/Industrial/id_effect"
