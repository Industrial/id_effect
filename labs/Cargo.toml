# Labs workspace (ADR 0010, Amendment 1): unpublished crates with no API guarantees.
# Kept separate from the main workspace so main CI never builds their heavy deps
# (rdkafka/OpenSSL, bundled SQLite, apalis). Built by the CI `labs` job:
#   cargo test --manifest-path labs/Cargo.toml --workspace
[workspace]
resolver = "2"
exclude = ["id_effect_lint"] # nightly-only Dylint crate; builds standalone
members = [
  "id_effect_ai",
  "id_effect_graph",
  "id_effect_jobs",
  "id_effect_parse",
  "id_effect_rpc",
  "id_effect_workflow",
]

# Keep in lockstep with the root [workspace.package].
[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/Industrial/id_effect"
