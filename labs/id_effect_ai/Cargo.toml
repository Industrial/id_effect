[package]
publish = false
name = "id_effect_ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Vendor-neutral LLM client traits and streaming for id_effect"
repository.workspace = true
readme = "README.md"
keywords = ["effect", "ai", "llm", "streaming", "mcp"]
categories = ["api-bindings", "asynchronous"]

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[features]
default = []
openai = []
anthropic = []
cursor = []
full = ["openai", "anthropic", "cursor"]

[dependencies]
id_effect = { path = "../../crates/id_effect", version = "0.11.0" }
id_effect_config = { path = "../../crates/id_effect_config", version = "0.11.0" }
id_effect_platform = { path = "../../crates/id_effect_platform", version = "0.11.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "time"] }
id_effect_tokio = { path = "../../crates/id_effect_tokio" }
id_effect_cli = { path = "../../crates/id_effect_cli", features = ["clap"] }
wiremock = "0.6"
clap = { version = "4", features = ["derive"] }

[[example]]
name = "mcp_server_template"
path = "examples/mcp_server_template.rs"

[[example]]
name = "010_openai_once"
path = "examples/010_openai_once.rs"
required-features = ["openai"]

[[example]]
name = "011_anthropic_once"
path = "examples/011_anthropic_once.rs"
required-features = ["anthropic"]

[[example]]
name = "ask_once"
path = "examples/ask_once.rs"
required-features = ["openai", "anthropic"]

[[example]]
name = "020_cursor_agent_once"
path = "examples/020_cursor_agent_once.rs"
required-features = ["cursor"]

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "labs"
