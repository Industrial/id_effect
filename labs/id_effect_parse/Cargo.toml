[package]
publish = false
name = "id_effect_parse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Parser combinators, pretty printing, invertible codecs, and value diffs for id_effect"
repository.workspace = true
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lib]
name = "id_effect_parse"

[dependencies]
id_effect = { path = "../../crates/id_effect", version = "0.12.0" }

[dev-dependencies]
rstest = "0.26"
id_effect_proc_macro = { path = "../../crates/id_effect_proc_macro" }

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "labs"
