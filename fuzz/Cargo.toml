# cargo-fuzz targets over the public decoders (docs/security/fuzzing.md). Outside the main
# workspace: it builds only on the nightly pinned in rust-toolchain.toml (0.11.0.md D20).
[package]
name = "id_effect_fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

# Its own workspace, so the root workspace never builds it on stable.
[workspace]
members = ["."]

[lib]
path = "src/lib.rs"
test = false
doc = false

[dependencies]
libfuzzer-sys = "0.4"
id_effect = { path = "../crates/id_effect", default-features = false, features = [
  "schema-serde",
] }
id_effect_auth = { path = "../crates/id_effect_auth", features = [
  "jwt",
  "totp",
] }
# `sse`: `realtime::sse::LastEventId` (sse_last_event_id).
id_effect_axum = { path = "../crates/id_effect_axum", features = ["sse"] }
id_effect_config = { path = "../crates/id_effect_config" }
id_effect_node = { path = "../crates/id_effect_node" }
id_effect_process = { path = "../crates/id_effect_process" }
# The rpc decoders (0.12): wire envelopes and batches, frames, resume, and the postcard codec.
id_effect_rpc = { path = "../crates/id_effect_rpc", default-features = false, features = [
  "postcard",
] }
# The 0.13 breadth decoders: admin form bodies, AI tool arguments, vendor SSE events and MCP
# messages (`mcp` turns on `tools`), keyset page cursors (`repository`), Accept-Language.
id_effect_admin = { path = "../crates/id_effect_admin" }
id_effect_ai = { path = "../crates/id_effect_ai", features = ["mcp"] }
id_effect_i18n = { path = "../crates/id_effect_i18n" }
id_effect_sql = { path = "../crates/id_effect_sql", features = ["repository"] }
axum = { version = "0.8", default-features = false, features = ["multipart"] }
base64 = "0.22.1"
futures = { version = "0.3", default-features = false, features = ["executor"] }
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tower = { version = "0.5.3", default-features = false, features = ["util"] }

[profile.release]
debug = 1

[[bin]]
name = "schema_json"
path = "fuzz_targets/schema_json.rs"
test = false
doc = false
bench = false

