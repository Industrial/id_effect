# cargo-nextest configuration (workspace root).
#
# The two trybuild suites share trybuild's generated project under target/tests/trybuild; run in
# parallel (nextest runs each test binary in its own process) they overwrite each other's case
# list and report "expected to fail to compile, but succeeded". Serialise them.

[test-groups]
trybuild = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(id_effect) & (binary(next_ui) | binary(ui_compile_fail))'
test-group = 'trybuild'
