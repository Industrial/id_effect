# cargo-deny policy for the main workspace (labs/ is a separate workspace and out of scope).
# Run: `cargo deny check` (moon: `moon run effect:deny`; CI: the `deny` job in ci.yml).
# Cargo.lock is not committed, so CI checks a fresh resolution; run `cargo update` first if a
# stale local lock reports advisories that a fresh resolve no longer pulls in.
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Check optional dependencies too: features such as `pg` pull in sqlx and friends.
all-features = true

[advisories]
# RUSTSEC-2023-0071 is the same ignore as .cargo/audit.toml (keep the two in sync).
# The rest are unmaintained/unsound notices that `cargo audit` reports as warnings only.
# Each is a known debt with a named dependency path, not a silent pass: remove the
# entry when the dependency is replaced. Vulnerabilities are never ignored here
# without a reason that says why the vulnerable code path is unreachable.
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa (Marvin attack: a timing side channel in RSA private-key operations) arrives via sqlx-mysql (id_effect_sql feature mysql) and openidconnect (id_effect_auth feature oidc); sqlx-mysql only encrypts a password with the server's public key (caching_sha2_password / sha256_password over a non-TLS connection), and no workspace code decrypts or signs with an rsa private key: ID tokens are verified by jsonwebtoken on aws-lc-rs" },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 (timing variability in constant-time operations) arrives only via openidconnect 4.0.1 (latest) -> p256/p384 0.13 -> elliptic-curve 0.13 (id_effect_auth feature oidc); no workspace code performs an elliptic-curve private-key operation through it: ID tokens are verified by jsonwebtoken on aws-lc-rs, and signature verification handles public data only. Remove when openidconnect moves to elliptic-curve 0.14 (crypto-bigint 0.7)" },
  { id = "RUSTSEC-2023-0126", reason = "im 15.1.0 OrdSet aliasing (unsound): direct dep of id_effect_fp and id_effect_optics; open debt until im is replaced" },
  { id = "RUSTSEC-2026-0248", reason = "im is unmaintained: direct dep of id_effect_fp and id_effect_optics; open debt until im is replaced" },
  { id = "RUSTSEC-2026-0247", reason = "bitmaps is unmaintained: transitive via im (see RUSTSEC-2026-0248)" },
  { id = "RUSTSEC-2026-0251", reason = "sized-chunks is unmaintained: transitive via im (see RUSTSEC-2026-0248)" },
  { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill is unmaintained: transitive via heapless 0.7 <- postcard <- foca/id_effect_node" },
  { id = "RUSTSEC-2026-0381", reason = "webpki-roots 0.26.11 (via sqlx-core 0.8.6) is the semver-trick shim that re-exports webpki-roots 1 (`parent = { package = \"webpki-roots\", version = \"1\" }`), which the lockfile resolves to the fixed 1.0.10; its roots are the patched ones. Remove when sqlx moves to webpki-roots 1" },
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained: transitive via serde_yaml <- figment <- id_effect_config" },
]

[licenses]
# Derived from `cargo deny check licenses` on the main workspace (all features).
# CDLA-Permissive-2.0: webpki-root-certs (Mozilla CA data). MPL-2.0 also satisfies the
# MPL-2.0+ of im / bitmaps / sized-chunks.
allow = [
  # Zero-clause BSD (permissive, OSI, no conditions): quoted_printable, via lettre (id_effect_mail).
  "0BSD",
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  # Boost 1.0 (permissive, OSI): xxhash-rust, via redis (id_effect_redis).
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  # MIT No Attribution (permissive, OSI): borrow-or-share, via jsonschema (id_effect_test).
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Unpublished workspace members (examples) carry no license field.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace members are fine; registry wildcards are not.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
