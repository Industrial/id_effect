[package]
name = "kernel_a"
description = "0.7 kernel spike A: typed R via HList + index inference (unpublished, temporary)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# `effect!` / `effect_local!` / `caps!`. A path dependency inside the spikes workspace directory,
# so cargo treats it as an implicit workspace member (spikes/Cargo.toml stays untouched).
kernel_a_macros = { path = "macros" }
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "time"] }

[dev-dependencies]
spike_corpus.workspace = true
trybuild = "1.0.116"
criterion = "0.8.2"
cpu-time = "1.0.0"

[[bench]]
name = "gate"
harness = false

[lints]
workspace = true
