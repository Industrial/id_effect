[package]
name = "kernel_b"
description = "0.7 kernel spike B: typed R via trait-bound env (unpublished, temporary)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["tokio"]
# The tokio `Executor` backend. Without it the kernel still runs on its own `ParkExecutor`.
tokio = ["dep:tokio"]

[dependencies]
# `#[derive(Env)]`, `effect!`, `effect_local!`. A path dependency inside the spikes workspace
# directory, so cargo makes it a workspace member automatically (spikes/Cargo.toml is untouched).
kernel_b_derive = { path = "derive" }
tokio = { version = "1.52.1", default-features = false, features = [
  "rt",
  "time",
], optional = true }

[dev-dependencies]
spike_corpus.workspace = true
trybuild = "1.0.116"
criterion = "0.8.2"
cpu-time = "1.0.0"
tokio = { version = "1.52.1", features = [
  "rt",
  "rt-multi-thread",
  "time",
  "macros",
] }

[[bench]]
name = "gate_b"
harness = false

[lints]
workspace = true
