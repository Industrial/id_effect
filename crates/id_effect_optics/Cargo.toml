[package]
name = "id_effect_optics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Functional optics — Lens, Prism, Traversal, JSON patch, and schema field paths for id_effect"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["optics", "lens", "prism", "traversal", "effect"]
categories = ["data-structures"]

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lib]
name = "id_effect_optics"

[dependencies]
id_effect = { path = "../id_effect", version = "0.10.0", features = [
  "schema-serde",
] }
im = "15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
rstest = "0.26"

[[example]]
name = "010_lens"
path = "examples/010_lens.rs"

[[example]]
name = "020_prism"
path = "examples/020_prism.rs"

[[example]]
name = "030_schema_patch"
path = "examples/030_schema_patch.rs"

[[example]]
name = "040_traversal"
path = "examples/040_traversal.rs"

[[example]]
name = "050_zipper"
path = "examples/050_zipper.rs"

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "maintenance"
