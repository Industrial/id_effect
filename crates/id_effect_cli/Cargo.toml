[package]
name = "id_effect_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI helpers for id_effect: optional clap, Exit/Cause → ExitCode, tracing buffer, run_main"
repository.workspace = true
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(coverage)',
  'cfg(feature, values("mock", "clap", "completions"))',
] }

[features]
default = ["clap"]
clap = ["dep:clap"]
# `completions::{generate, CompletionsArgs}`: shell completion scripts via `clap_complete`.
completions = ["clap", "dep:clap_complete"]

[dependencies]
id_effect = { path = "../id_effect", version = "0.8.0" }
clap = { version = "4.5", optional = true, default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
] }
clap_complete = { version = "4.5", optional = true }
# `signal`: `run_main`'s Ctrl-C watcher (feature unification also enables the signal driver of
# the default runtime, which is built with `enable_all`).
tokio = { version = "1.50.0", default-features = false, features = [
  "macros",
  "signal",
  "sync",
] }

[dev-dependencies]
rstest = "0.26"

[[bin]]
name = "ie_cli_probe"
path = "src/bin/ie_cli_probe.rs"
required-features = ["clap"]

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "integration"
