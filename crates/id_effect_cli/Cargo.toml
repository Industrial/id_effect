[package]
name = "id_effect_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI helpers for id_effect: optional clap, Exit/Cause → ExitCode, tracing buffer, run_main"
repository.workspace = true
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(coverage)',
  'cfg(feature, values("mock", "clap"))',
] }

[features]
default = ["clap"]
clap = ["dep:clap"]

[dependencies]
id_effect = { path = "../id_effect", version = "0.7.0" }
clap = { version = "4.5", optional = true, default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
] }

[dev-dependencies]
rstest = "0.26"

[[bin]]
name = "ie_cli_probe"
path = "src/bin/ie_cli_probe.rs"
required-features = ["clap"]

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "integration"
