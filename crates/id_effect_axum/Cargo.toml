[package]
name = "id_effect_axum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Axum and Tower integration for id_effect — Send-safe Effect handlers, request-scoped capabilities, host lifecycle"
repository.workspace = true
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(coverage)',
  'cfg(feature, values("mock"))',
] }

[lib]
name = "id_effect_axum"

[features]
default = []
cluster = ["dep:id_effect_node"]
# Tower `Service` bridge (`service` module).
tower = ["dep:tower"]
# OpenAPI 3.1 documents generated from typed routes (`openapi` module), the opt-in
# `/openapi.json` + Scalar `/docs` router and the `/_routes` table (`route::introspect`).
openapi = []
# Realtime (0.12, declared once here for every 0.12 leaf; r12-e12-2-axum-ws-sse).
# Effect-native WebSocket endpoints (`realtime::ws`): typed routes, an Origin allowlist, bounded
# frames, message rate and sockets per client IP, heartbeats and an idle timeout. tungstenite is
# the version axum 0.8.9's own `ws` feature uses, so the tree keeps one tungstenite.
ws = [
  "dep:tokio-tungstenite",
  "dep:tungstenite",
  "dep:futures-util",
  "dep:hyper",
]
# Server-sent events with event ids, `Last-Event-ID` resume and heartbeats (`realtime::sse`).
sse = []
# TLS and HTTP/2 serving (`server::tls`, r12-e12-3-tls-h2): TLS 1.3/1.2 on TCP, ALPN `h2` and
# `http/1.1`, the certificate from the platform `tls` identity (reloaded for new connections).
tls = ["dep:tokio-rustls", "hyper-util/http2", "id_effect_platform/tls"]
# HTTP/3 serving on the shared QUIC endpoint (r12-e12-3-h3-server).
http3 = [
  "tls",
  "dep:h3",
  "dep:h3-quinn",
  "dep:quinn",
  "dep:bytes",
  "id_effect_platform/quic",
]
# WebTransport sessions over HTTP/3 (r12-e12-3-webtransport).
webtransport = ["http3", "dep:h3-webtransport", "h3-quinn/datagram"]
# Server-rendered UI (`ui` module; r13-e9-5-views, ADR 0015 D3): maud `Markup` responses,
# components, layouts and partials, htmx helpers with the vendored htmx 2.0.11
# (`assets/README.md`) and HTML forms bound to `Schema` decode errors.
ui = ["dep:maud"]

[dependencies]
id_effect = { path = "../id_effect", version = "0.13.0", features = [
  "schema-serde",
] }
id_effect_config = { path = "../id_effect_config", version = "0.13.0" }
id_effect_platform = { path = "../id_effect_platform", version = "0.13.0" }
id_effect_node = { path = "../id_effect_node", version = "0.13.0", optional = true }
# `multipart`: typed routes and `ValidForm` read the text fields of `multipart/form-data` bodies.
axum = { version = "0.8.9", features = ["multipart"] }
http-body = "1"
http-body-util = "0.1"
# `server::serve_listener`: the accept loop (header-read timeout, keep-alive limit, connection
# cap, connect info); already in axum's dependency tree. 0.1.12: `TokioTimer`, auto-builder
# `header_read_timeout` and `graceful_shutdown`.
hyper-util = { version = "0.1.12", features = [
  "http1",
  "server",
  "service",
  "tokio",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "signal",
  "net",
  "sync",
  "time",
] }
# 0.5.0 does not build under minimal-version resolution (const / Identity::new).
tower = { version = "0.5.3", features = ["util"], optional = true }
# `CapOverrideLayer` (request-scoped capabilities); already in axum's dependency tree.
tower-layer = "0.3.3"
tower-service = "0.3.3"
# Web hardening (`server::security`): CORS, CSRF tokens, CSP nonces/hashes, signed cookies.
base64 = "0.22.1"
cookie = { version = "0.18.1", features = ["signed", "private"] }
# The CSRF cookie's signature, keyed once per layer (`cookie`'s signed-jar MAC); already in
# cookie's dependency tree.
hmac = "0.12.1"
rand = "0.9"
sha2 = "0.10.9"
subtle = "2.6.1"
tower-http = { version = "0.6.8", default-features = false, features = [
  "cors",
  # `middleware::CompressionLayer` (pure-Rust encoders; zstd would need a C toolchain).
  "compression-br",
  "compression-deflate",
  "compression-gzip",
  # `server::serve_dir` (static files, conditional GET, precompressed variants).
  "fs",
] }
# `HTTP-date` validators (`Last-Modified` / `If-Modified-Since`); already in tower-http's `fs` tree.
httpdate = "1.0.3"
# `middleware::RateLimitLayer`: token buckets on the effect runtime.
id_effect_resilience = { path = "../id_effect_resilience", version = "0.13.0" }
# `route::Router::into_axum` logs the access report (public routes, opt-outs) at startup;
# already in axum's dependency tree.
tracing = "0.1"
# Feature `ws` (exact pins, r12-e12-2-axum-ws-sse). The upgrade is hyper's (`hyper::upgrade::on`),
# the framing tungstenite's over the upgraded connection; `handshake` only for
# `derive_accept_key` (sha1 + base64 of the client key). Same versions as axum's `ws` feature.
tokio-tungstenite = { version = "=0.29.0", optional = true, default-features = false, features = [
  "handshake",
] }
tungstenite = { version = "=0.29.0", optional = true, default-features = false, features = [
  "handshake",
] }
futures-util = { version = "=0.3.34", optional = true, default-features = false, features = [
  "sink",
] }
hyper = { version = "=1.12.0", optional = true, default-features = false, features = [
  "http1",
  "server",
] }
# Features `tls`, `http3`, `webtransport` (declared here once for r12-e12-3-tls-h2,
# r12-e12-3-h3-server and r12-e12-3-webtransport; exact pins). aws-lc-rs only, as
# id_effect_node: no second rustls provider.
tokio-rustls = { version = "=0.26.6", optional = true, default-features = false, features = [
  "logging",
  "tls12",
] }
quinn = { version = "=0.11.12", optional = true, default-features = false, features = [
  "log",
  "runtime-tokio",
  "rustls-aws-lc-rs",
] }
h3 = { version = "=0.0.8", optional = true }
h3-quinn = { version = "=0.0.10", optional = true }
h3-webtransport = { version = "=0.1.2", optional = true }
# Feature `http3` (r12-e12-3-h3-server): `Buf` for the h3 request body chunks; the version
# already in the tree (axum, h3, quinn).
bytes = { version = "=1.12.1", optional = true }
# Feature `ui` (r13-e9-5-views; exact pin, pre-1.0): compile-time templates that escape every
# interpolation. `axum`: `Markup` answers `text/html; charset=utf-8` through axum-core 0.5, the
# version axum 0.8.9 already brings.
maud = { version = "=0.27.0", optional = true, features = ["axum"] }

[[bench]]
name = "gate_request"
harness = false

# `ui/render_list_50` (docs/benchmarks/gates.toml, r13-e-benches).
[[bench]]
name = "ui_render"
harness = false
required-features = ["ui"]

[dev-dependencies]
criterion = "0.8.2"
# Example 040_app_host demos the session store behind platform's opt-in `auth` feature.
# Path-only: cargo publish resolves path+version dev-deps on crates.io.
id_effect_platform = { path = "../id_effect_platform", features = ["auth"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }
# `load-shed` + `limit`: load shedding in front of the secure-stack bench (benches/gate_request.rs).
tower = { version = "0.5.3", features = ["util", "load-shed", "limit"] }
# The secure-stack bench's authentication, route guard and default log redaction. Path-only, like
# id_effect_platform above (id_effect_auth and id_effect_authz depend on this crate).
id_effect_auth = { path = "../id_effect_auth", features = ["axum"] }
id_effect_authz = { path = "../id_effect_authz", features = ["axum"] }
id_effect_logger = { path = "../id_effect_logger" }
# tests/openapi.rs validates generated documents against the OpenAPI 3.1 meta-schema (MIT;
# no remote reference resolution needed, so no default features).
jsonschema = { version = "0.59", default-features = false }
# tests/ui.rs: compile-fail cases (H8: a route without an access decision does not compile).
trybuild = "1"
# tests/ws.rs and example 090: a WebSocket client (same pin as the `ws` feature).
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = [
  "connect",
  "handshake",
] }
futures-util = { version = "=0.3.34", default-features = false, features = [
  "sink",
] }
# tests/tls_h2.rs: a TLS client (same pins as the `tls` feature), HTTP/1.1 and HTTP/2 client
# connections, and a test CA issuing the server certificates (the platform's rcgen).
tokio-rustls = { version = "=0.26.6", default-features = false, features = [
  "logging",
  "tls12",
] }
hyper = { version = "=1.12.0", default-features = false, features = [
  "client",
  "http1",
  "http2",
] }
rcgen = { version = "=0.14.10", default-features = false, features = [
  "aws_lc_rs",
  "pem",
] }

[[example]]
name = "050_tower_effect_service"
required-features = ["tower"]

[[example]]
name = "051_tower_shared_counter"
required-features = ["tower"]

[[example]]
name = "085_openapi"
required-features = ["openapi"]

[[example]]
name = "090_ws_echo"
required-features = ["ws"]

[[example]]
name = "091_sse_ticker"
required-features = ["sse"]

[[example]]
name = "092_http3"
required-features = ["http3"]

[[example]]
name = "095_htmx_todo"
required-features = ["ui"]

[[test]]
name = "ws"
required-features = ["ws"]

[[test]]
name = "sse"
required-features = ["sse"]

[package.metadata.docs.rs]
all-features = true

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "integration"
