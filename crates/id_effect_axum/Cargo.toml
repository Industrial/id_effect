[package]
name = "id_effect_axum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Axum and Tower integration for id_effect — Send-safe Effect handlers, request-scoped capabilities, host lifecycle"
repository.workspace = true
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(coverage)',
  'cfg(feature, values("mock"))',
] }

[lib]
name = "id_effect_axum"

[features]
default = []
cluster = ["dep:id_effect_node"]
# Tower `Service` bridge (`service` module).
tower = ["dep:tower"]
# OpenAPI 3.1 documents generated from typed routes (`openapi` module), the opt-in
# `/openapi.json` + Scalar `/docs` router and the `/_routes` table (`route::introspect`).
openapi = []

[dependencies]
id_effect = { path = "../id_effect", version = "0.10.1", features = [
  "schema-serde",
] }
id_effect_config = { path = "../id_effect_config", version = "0.10.1" }
id_effect_platform = { path = "../id_effect_platform", version = "0.10.1" }
id_effect_node = { path = "../id_effect_node", version = "0.10.1", optional = true }
# `multipart`: typed routes and `ValidForm` read the text fields of `multipart/form-data` bodies.
axum = { version = "0.8", features = ["multipart"] }
http-body = "1"
http-body-util = "0.1"
# `server::serve_listener`: the accept loop (header-read timeout, keep-alive limit, connection
# cap, connect info); already in axum's dependency tree. 0.1.12: `TokioTimer`, auto-builder
# `header_read_timeout` and `graceful_shutdown`.
hyper-util = { version = "0.1.12", features = [
  "http1",
  "server",
  "service",
  "tokio",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "signal",
  "net",
  "sync",
  "time",
] }
# 0.5.0 does not build under minimal-version resolution (const / Identity::new).
tower = { version = "0.5.3", features = ["util"], optional = true }
# `CapOverrideLayer` (request-scoped capabilities); already in axum's dependency tree.
tower-layer = "0.3.3"
tower-service = "0.3.3"
# Web hardening (`server::security`): CORS, CSRF tokens, CSP nonces/hashes, signed cookies.
base64 = "0.22.1"
cookie = { version = "0.18.1", features = ["signed", "private"] }
rand = "0.9"
sha2 = "0.10.9"
subtle = "2.6.1"
tower-http = { version = "0.6.8", default-features = false, features = [
  "cors",
  # `middleware::CompressionLayer` (pure-Rust encoders; zstd would need a C toolchain).
  "compression-br",
  "compression-deflate",
  "compression-gzip",
  # `server::serve_dir` (static files, conditional GET, precompressed variants).
  "fs",
] }
# `HTTP-date` validators (`Last-Modified` / `If-Modified-Since`); already in tower-http's `fs` tree.
httpdate = "1.0.3"
# `middleware::RateLimitLayer`: token buckets on the effect runtime.
id_effect_resilience = { path = "../id_effect_resilience", version = "0.10.1" }

[[bench]]
name = "gate_request"
harness = false

[dev-dependencies]
criterion = "0.8.2"
# Example 040_app_host demos the session store behind platform's opt-in `auth` feature.
# Path-only: cargo publish resolves path+version dev-deps on crates.io.
id_effect_platform = { path = "../id_effect_platform", features = ["auth"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }
tower = { version = "0.5.3", features = ["util"] }
# tests/openapi.rs validates generated documents against the OpenAPI 3.1 meta-schema (MIT;
# no remote reference resolution needed, so no default features).
jsonschema = { version = "0.59", default-features = false }

[[example]]
name = "050_tower_effect_service"
required-features = ["tower"]

[[example]]
name = "051_tower_shared_counter"
required-features = ["tower"]

[[example]]
name = "085_openapi"
required-features = ["openapi"]

[package.metadata.docs.rs]
all-features = true

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "integration"
