[package]
name = "id_effect_axum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Axum integration for the workspace `effect` crate — run Effect handlers on Tokio"
repository.workspace = true

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(coverage)',
  'cfg(feature, values("mock"))',
] }

[lib]
name = "id_effect_axum"

[features]
default = []
cluster = ["dep:id_effect_node"]
# Tower `Service` bridge (`service` module); formerly the id_effect_tower crate.
tower = ["dep:tower"]

[dependencies]
id_effect = { path = "../id_effect", version = "0.5.0", features = [
  "schema-serde",
] }
id_effect_tokio = { path = "../id_effect_tokio", version = "0.5.0" }
id_effect_config = { path = "../id_effect_config", version = "0.5.0" }
id_effect_platform = { path = "../id_effect_platform", version = "0.5.0" }
id_effect_node = { path = "../id_effect_node", version = "0.5.0", optional = true }
axum = { version = "0.8" }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "signal",
  "net",
  "sync",
  "time",
] }
# 0.5.0 does not build under minimal-version resolution (const / Identity::new).
tower = { version = "0.5.3", features = ["util"], optional = true }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }

[[example]]
name = "050_tower_effect_service"
required-features = ["tower"]

[[example]]
name = "051_tower_shared_counter"
required-features = ["tower"]

[package.metadata.docs.rs]
all-features = true

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "integration"
