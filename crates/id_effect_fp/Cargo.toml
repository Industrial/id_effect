[package]
name = "id_effect_fp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Functional-programming toolkit for id_effect: algebraic type classes, persistent collections, STM (maintenance tier)"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["functional", "algebra", "persistent", "stm", "effect"]
categories = ["data-structures", "concurrency"]

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dependencies]
# `compute` (default) supplies the Fabric-aware Rayon dispatch the bulk collection ops use.
id_effect = { path = "../id_effect", version = "0.6.0", features = ["compute"] }
im = "15"
rayon = "1.12"

[dev-dependencies]
proptest = "1"
rstest = "0.26"

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "maintenance"
