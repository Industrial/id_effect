[package]
name = "id_effect_node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Distribution layer for the id_effect Process Mesh: node identity, cookie handshake, and pluggable transports (InMemory/TCP/QUIC)"
license.workspace = true
repository.workspace = true
keywords = ["effect", "distributed", "cluster", "mesh", "actor"]
categories = ["asynchronous", "network-programming"]

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lib]
name = "id_effect_node"

[features]
default = []
quic = ["dep:quinn", "dep:rustls", "dep:rcgen"]
# Postgres advisory-lock SingletonLease (CP production path, ADR 0009).
pg = ["dep:id_effect_sql", "id_effect_sql/pg", "dep:sqlx"]

[dependencies]
id_effect = { path = "../id_effect", version = "0.5.0" }
id_effect_process = { path = "../id_effect_process", version = "0.5.0" }
async-trait = "0.1"
bytes = "1"
flume = "0.11"
hmac = "0.12"
foca = { version = "1", features = ["std", "postcard-codec"] }
postcard = { version = "1", features = ["alloc"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.50", features = [
  "rt",
  "net",
  "io-util",
  "sync",
  "time",
] }
tracing = "0.1"

quinn = { version = "0.11", optional = true }
rustls = { version = "0.23", optional = true }
rcgen = { version = "0.13", optional = true }

# Postgres advisory-lock lease backend (feature `pg`).
id_effect_sql = { path = "../id_effect_sql", version = "0.5.0", optional = true }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "postgres",
], optional = true }

[dev-dependencies]
pollster = "0.4"
tokio = { version = "1.50", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "sync",
  "time",
] }

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "runtime"
