[package]
name = "id_effect_node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Distribution layer for the id_effect Process Mesh: node identity, cookie handshake, and pluggable transports (InMemory/TCP/QUIC)"
license.workspace = true
repository.workspace = true
keywords = ["effect", "distributed", "cluster", "mesh", "actor"]
categories = ["asynchronous", "network-programming"]

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lib]
name = "id_effect_node"

[features]
default = []
quic = ["dep:quinn", "dep:rustls", "dep:rcgen"]
# TLS 1.3 with mutual auth over TCP (transport::tls_tcp; shares transport::certs with `quic`).
tls-tcp = ["dep:rustls", "dep:rcgen", "dep:tokio-rustls"]
# Plaintext TCP (`TcpTransport::dangerous_plaintext`): neither encrypted nor authenticated.
insecure-plaintext-tcp = []
# Kubernetes discovery: ready EndpointSlice addresses from the in-cluster API over rustls (D18).
kubernetes = [
  "dep:rustls",
  "dep:tokio-rustls",
  "dep:hyper",
  "dep:hyper-util",
  "dep:http-body-util",
  "dep:serde_json",
]
# Postgres advisory-lock SingletonLease (CP production path, ADR 0009).
pg = ["dep:id_effect_sql", "id_effect_sql/pg", "dep:sqlx"]

[dependencies]
id_effect = { path = "../id_effect", version = "0.10.1" }
id_effect_process = { path = "../id_effect_process", version = "0.10.1" }
async-trait = "0.1"
bytes = "1"
flume = "0.11"
hmac = "0.12"
foca = { version = "1", features = ["std", "postcard-codec"] }
postcard = { version = "1", features = ["alloc"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.50", features = [
  "rt",
  "net",
  "io-util",
  "sync",
  "time",
] }
tracing = "0.1"

# Floors carry security fixes (quinn-proto >= 0.11.18 via quinn 0.11.12: RUSTSEC-2026-0338..0342;
# rustls 0.23.46: RUSTSEC-2026-0285, RUSTSEC-2026-0346..0349) and keep -Z minimal-versions buildable.
# aws-lc-rs, not quinn's default ring: sqlx, reqwest and jsonwebtoken use aws-lc-rs, and with both
# rustls providers compiled in, rustls cannot pick a process default (sqlx's TLS configs panic).
quinn = { version = "0.11.12", optional = true, default-features = false, features = [
  "log",
  "platform-verifier",
  "runtime-tokio",
  "rustls-aws-lc-rs",
  "bloom",
] }
rustls = { version = "0.23.46", optional = true }
# aws-lc-rs, as rustls uses (not rcgen's default ring); `pem` for PEM output.
rcgen = { version = "0.13", optional = true, default-features = false, features = [
  "aws_lc_rs",
  "pem",
] }
# Features `tls-tcp` and `kubernetes`: TLS over Tokio TCP, without a second crypto provider.
tokio-rustls = { version = "0.26.6", optional = true, default-features = false, features = [
  "logging",
  "tls12",
] }
# Feature `kubernetes`: a minimal HTTP/1.1 client for the API server (no kube-rs, D18).
hyper = { version = "1.12", optional = true, default-features = false, features = [
  "client",
  "http1",
] }
hyper-util = { version = "0.1.12", optional = true, default-features = false, features = [
  "tokio",
] }
http-body-util = { version = "0.1", optional = true }
serde_json = { version = "1", optional = true }

# Postgres advisory-lock lease backend (feature `pg`).
id_effect_sql = { path = "../id_effect_sql", version = "0.10.1", optional = true }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "postgres",
], optional = true }

[dev-dependencies]
pollster = "0.4"
proptest = "1"
tokio = { version = "1.50", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "sync",
  "time",
] }
# Test CAs and node certificates (tests/transport_tls.rs; RSA keys need aws-lc-rs), and the
# in-process TLS API server of the Kubernetes discovery tests.
rcgen = { version = "0.13", default-features = false, features = [
  "aws_lc_rs",
  "pem",
] }
tokio-rustls = { version = "0.26.6", default-features = false, features = [
  "logging",
  "tls12",
] }
hyper = { version = "1.12", default-features = false, features = [
  "server",
  "http1",
] }
hyper-util = { version = "0.1.12", default-features = false, features = [
  "tokio",
] }
http-body-util = "0.1"
serde_json = "1"

[[example]]
name = "134_mtls_cluster"
required-features = ["quic"]

[[test]]
name = "transport_tls"
required-features = ["quic"]

[[test]]
name = "transport_tcp_tls"
required-features = ["tls-tcp"]

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "runtime"
