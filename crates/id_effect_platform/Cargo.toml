[package]
name = "id_effect_platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Platform capability traits (HTTP, FS, subprocess commands) for id_effect — @effect/platform-style boundaries"
repository.workspace = true
readme = "README.md"
keywords = ["effect", "async", "http", "filesystem", "platform"]
categories = ["asynchronous", "network-programming"]

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[features]
# Session store + OAuth client capability traits (web-framework material; opt-in since 0.6).
auth = []
# In-memory test doubles (`MemoryOAuthClient`) for downstream tests.
test-util = ["auth"]

[dependencies]
id_effect = { path = "../id_effect", version = "0.10.1", features = [
  "schema-serde",
] }
bytes = { version = "1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = { version = "1" }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "gzip",
  "rustls",
] }
tokio = { version = "1.50.0", features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt",
  "sync",
] }

[dev-dependencies]
# Self dev-dep so integration tests see `test-util` doubles.
id_effect_platform = { path = ".", features = ["test-util"] }
id_effect_tokio = { path = "../id_effect_tokio" }
rstest = "0.26"
tempfile = "3"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = true

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "integration"
