[package]
name = "id_effect_sql_pg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Deprecated: merged into id_effect_sql (feature `pg`); re-export shim removed in 0.7"
repository.workspace = true
readme = "README.md"
keywords = ["effect", "async", "sql", "postgres", "database"]
categories = ["asynchronous", "database"]

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dependencies]
id_effect_sql = { path = "../id_effect_sql", version = "0.5.0", features = [
  "pg",
] }

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "merge"
merge_into = "id_effect_sql"
