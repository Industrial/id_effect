[package]
name = "id_effect_sql_pg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PostgreSQL driver for id_effect_sql — sqlx pool and PgSqlClient"
repository.workspace = true
readme = "README.md"
keywords = ["effect", "async", "sql", "postgres", "database"]
categories = ["asynchronous", "database"]

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dependencies]
id_effect = { path = "../id_effect", version = "0.5.0" }
id_effect_sql = { path = "../id_effect_sql", version = "0.5.0" }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "uuid",
] }
tokio = { version = "1.50.0", features = ["rt", "sync"] }

[dev-dependencies]
id_effect_tokio = { path = "../id_effect_tokio" }
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "merge"
merge_into = "id_effect_sql"
