[package]
name = "id_effect_config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Configuration for id_effect: Config descriptors, ConfigProvider and Figment/serde loading"
repository.workspace = true
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(coverage)',
  'cfg(feature, values("mock"))',
] }
[lints.clippy]
# ConfigError embeds figment::Error; returning Result<_, ConfigError> trips result_large_err under -D warnings.
result_large_err = "allow"

[features]
default = ["env", "toml"]
# `figment` providers
env = ["figment/env"]
toml = ["figment/toml"]
json = ["figment/json"]
yaml = ["figment/yaml"]
# Load `.env` before reading `std::env` (via `dotenvy`)
dotenv = ["dep:dotenvy"]

[lib]
name = "id_effect_config"

[dependencies]
id_effect = { path = "../id_effect", version = "0.7.0" }
# Floor for figment's pear dep: 0.2.0 does not build on current Rust (fmt::Write on InlinableString).
pear = "0.2.9"
figment = { version = "0.10.19", default-features = false }
serde = { version = "1", default-features = false }
url = { version = "2", default-features = false }
dotenvy = { version = "0.15", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
temp-env = "0.3"
tempfile = "3"

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "core"
