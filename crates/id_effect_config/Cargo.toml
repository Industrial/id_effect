[package]
name = "id_effect_config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Configuration for id_effect: Config descriptors, ConfigProvider and Figment/serde loading"
repository.workspace = true
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(coverage)',
  'cfg(feature, values("mock"))',
] }
[lints.clippy]
# ConfigError embeds figment::Error; returning Result<_, ConfigError> trips result_large_err under -D warnings.
result_large_err = "allow"

[features]
default = ["env", "toml"]
# `figment` providers
env = ["figment/env"]
toml = ["figment/toml"]
json = ["figment/json"]
yaml = ["figment/yaml"]
# Load `.env` before reading `std::env` (via `dotenvy`)
dotenv = ["dep:dotenvy"]
# HashiCorp Vault KV v2 secret provider over HTTP (reqwest + rustls); runs on a tokio runtime.
vault = ["dep:reqwest", "dep:serde_json"]

[lib]
name = "id_effect_config"

[[example]]
name = "050_vault"
required-features = ["vault", "toml", "env"]

[dependencies]
id_effect = { path = "../id_effect", version = "0.13.0" }
# Floor for figment's pear dep: 0.2.0 does not build on current Rust (fmt::Write on InlinableString).
pear = "0.2.9"
figment = { version = "0.10.19", default-features = false }
serde = { version = "1", default-features = false }
# `Secret<T>` zeroizes its value on drop and compares `SecretString` / `SecretBytes` in constant
# time.
subtle = "2.6.1"
zeroize = "1.9.1"
url = { version = "2", default-features = false }
dotenvy = { version = "0.15", optional = true }
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
id_effect_tokio = { path = "../id_effect_tokio" }
serde = { version = "1", features = ["derive"] }
temp-env = "0.3"
tempfile = "3"
# Vault dev-server container for tests/vault_container.rs (feature `vault`).
testcontainers = { version = "0.28", default-features = false }
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "core"
