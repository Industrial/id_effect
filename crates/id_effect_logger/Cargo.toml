[package]
name = "id_effect_logger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "EffectLogger capability for id_effect: log levels, annotations and pluggable backends over tracing"
repository.workspace = true
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(coverage)',
  'cfg(feature, values("mock"))',
] }

[lib]
name = "id_effect_logger"

[dependencies]
id_effect = { path = "../id_effect", version = "0.10.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
rstest = "0.26"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "effect_logger"
path = "examples/effect_logger.rs"

[[example]]
name = "context_service"
path = "examples/context_service.rs"

[[example]]
name = "layer_build"
path = "examples/layer_build.rs"

[[example]]
name = "log_effects"
path = "examples/log_effects.rs"

[[example]]
name = "macro_sync_bind"
path = "examples/macro_sync_bind.rs"

[[example]]
name = "macro_block_tail"
path = "examples/macro_block_tail.rs"

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "core"
