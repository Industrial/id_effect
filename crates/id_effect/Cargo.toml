[package]
name = "id_effect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Effect<A, E, R>: lazy Send effects over a typed capability list, run on a fiber runtime (Tokio executor), with layers, streams, schedules and coordination"
license.workspace = true
repository.workspace = true

# Examples: numbered curriculum `examples/NNN_slug.rs` (auto-discovered). Tokio integration:
# `id_effect_tokio` (`106_tokio_runtime` … `109_tokio_end_to_end`). See `examples/README.md`.

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(coverage)',
  'cfg(feature, values("mock"))',
] }

[[bench]]
name = "phase0_baseline"
harness = false

[[bench]]
name = "effect_macro_bind_free"
harness = false

[[bench]]
name = "gate_core"
harness = false

[[bench]]
name = "next_kernel"
harness = false

# Compute Fabric examples (auto-discovered otherwise; listed only to gate on `compute`).
[[example]]
name = "120_compute_fabric_memory_cap"
required-features = ["compute"]

[[example]]
name = "121_compute_fabric_cpu_spread"
required-features = ["compute"]

[[example]]
name = "122_compute_fabric_effect_parallel"
required-features = ["compute"]

[[example]]
name = "110_property_testing"
required-features = ["proptest"]

[features]
default = ["compute"]
# Compute Fabric (`compute` module): resource-aware admission (`ComputeFabric`), adaptive Rayon
# parallelism for bulk ops, sysinfo telemetry. Off → serial bulk ops, no rayon/sysinfo deps (the
# kernel's fiber admission `Fabric` is always built).
compute = ["dep:rayon", "dep:sysinfo"]
# `serde_json::Value` ↔ [`crate::schema::Unknown`], JSON Schema helpers for primitives.
schema-serde = ["dep:serde_json"]
# `schema::validators::regex`: `pattern` validation backed by the `regex` crate (same source string
# is checked and exported as JSON Schema `pattern`). Optional so core users without it pay no
# regex compile cost; `pattern(s, source, matcher)` works without it.
schema-regex = ["dep:regex"]
# `testing::property`: proptest strategies for framework types and schemas, effect-aware
# properties under `TestExecutor`, stateful (model-based) testing.
proptest = ["dep:proptest"]
# `fiber_dump`: a process-wide registry of live fibers (id, parent, children, state, age, span
# chain) for `id_effect_console` (0.10 D8). Off → no registry, no per-fork cost.
fiber-registry = []

[dependencies]
futures = { version = "0.3", default-features = false, features = ["std"] }
id_effect_macro = { path = "../id_effect_macro", version = "0.10.0" }
id_effect_proc_macro = { path = "../id_effect_proc_macro", version = "0.10.0" }
flume = "0.12"
# 0.2.0 lacks APIs we use (`SignedDuration::from_nanos_i128`, `Error::from_args`).
jiff = "0.2.23"
rayon = { version = "1.12", optional = true }
# 0.39+ needs rustc ≥1.95 (cfg_select); pin until devenv rustc catches up.
sysinfo = { version = "0.33", optional = true }
serde_json = { version = "1", optional = true }
regex = { version = "1.12", optional = true }
proptest = { version = "1", optional = true, default-features = false, features = [
  "std",
] }
# Required (R6): the kernel's default `TokioExecutor` (`time` for real timers, `rt-multi-thread`
# for the default `Runtime::global`).
tokio = { version = "1.50.0", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }

[dev-dependencies]
trybuild = "1"
criterion = "0.8.2"
pollster = "1.0"
proptest = "1"
rstest = "0.26"
# Counting global allocator for `tests/kernel_alloc.rs` (the crate forbids `unsafe_code`, so
# the test cannot implement `GlobalAlloc` itself).
stats_alloc = "0.1"
tokio = { version = "1.50.0", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "core"
