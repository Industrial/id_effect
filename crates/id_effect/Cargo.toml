[package]
name = "id_effect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Effect<A, E, R> (sync + async), capability DI, pipe — interpreter-style, no bundled executor"
license.workspace = true
repository.workspace = true

# Examples: numbered curriculum `examples/NNN_slug.rs` (auto-discovered). Tokio integration:
# `id_effect_tokio` (`106_tokio_runtime` … `109_tokio_end_to_end`). See `examples/README.md`.

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(coverage)',
  'cfg(feature, values("mock"))',
] }

[[bench]]
name = "phase0_baseline"
harness = false

[[bench]]
name = "env_lookup"
harness = false

[[bench]]
name = "effect_macro_bind_free"
harness = false

[[bench]]
name = "startup_run_with"
harness = false

[features]
# Property-testing helpers in `testing::proptest`.
proptest = ["dep:proptest"]
# `serde_json::Value` ↔ [`crate::schema::Unknown`], JSON Schema helpers for primitives.
schema-serde = ["dep:serde_json"]
algebra = []

[dependencies]
futures = { version = "0.3", default-features = false, features = ["std"] }
id_effect_macro = { path = "../id_effect_macro", version = "0.5.0" }
id_effect_proc_macro = { path = "../id_effect_proc_macro", version = "0.5.0" }
flume = "0.12"
im = "15"
# 0.2.0 lacks APIs we use (`SignedDuration::from_nanos_i128`, `Error::from_args`).
jiff = "0.2.23"
rayon = "1.12"
# 0.39+ needs rustc ≥1.95 (cfg_select); pin until devenv rustc catches up.
sysinfo = "0.33"
serde_json = { version = "1", optional = true }
proptest = { version = "1", optional = true }
tokio = { version = "1.50.0", features = ["macros", "rt", "time", "sync"] }

[dev-dependencies]
# Path-only workspace test deps: version pins would require later publish levels on crates.io.
id_effect_config = { path = "../id_effect_config" }
id_effect_jobs = { path = "../id_effect_jobs", features = ["memory"] }
trybuild = "1"
criterion = "0.8.2"
pollster = "1.0"
proptest = "1"
rstest = "0.26"
tokio = { version = "1.50.0", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "core"
