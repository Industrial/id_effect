[package]
name = "id_effect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Effect<A, E, R> (sync + async), capability DI, pipe — interpreter-style, no bundled executor"
license.workspace = true
repository.workspace = true

# Examples: numbered curriculum `examples/NNN_slug.rs` (auto-discovered). Tokio integration:
# `id_effect_tokio` (`106_tokio_runtime` … `109_tokio_end_to_end`). See `examples/README.md`.

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(coverage)',
  'cfg(feature, values("mock"))',
] }

[[bench]]
name = "phase0_baseline"
harness = false

[[bench]]
name = "env_lookup"
harness = false

[[bench]]
name = "effect_macro_bind_free"
harness = false

[[bench]]
name = "gate_core"
harness = false

[[bench]]
name = "next_kernel"
harness = false

[[bench]]
name = "startup_run_with"
harness = false
required-features = ["compute"]

# Compute Fabric examples (auto-discovered otherwise; listed only to gate on `compute`).
[[example]]
name = "120_compute_fabric_memory_cap"
required-features = ["compute"]

[[example]]
name = "121_compute_fabric_cpu_spread"
required-features = ["compute"]

[[example]]
name = "122_compute_fabric_effect_parallel"
required-features = ["compute"]

[features]
default = ["compute"]
# Compute Fabric (`compute` module): admission, adaptive Rayon parallelism for bulk ops, sysinfo
# telemetry. Off → serial bulk ops, no fabric at `run`/`run_with`, no rayon/sysinfo deps.
compute = ["dep:rayon", "dep:sysinfo"]
# Property-testing helpers in `testing::proptest`.
proptest = ["dep:proptest"]
# `serde_json::Value` ↔ [`crate::schema::Unknown`], JSON Schema helpers for primitives.
schema-serde = ["dep:serde_json"]

[dependencies]
futures = { version = "0.3", default-features = false, features = ["std"] }
id_effect_macro = { path = "../id_effect_macro", version = "0.6.0" }
id_effect_proc_macro = { path = "../id_effect_proc_macro", version = "0.6.0" }
flume = "0.12"
# 0.2.0 lacks APIs we use (`SignedDuration::from_nanos_i128`, `Error::from_args`).
jiff = "0.2.23"
rayon = { version = "1.12", optional = true }
# 0.39+ needs rustc ≥1.95 (cfg_select); pin until devenv rustc catches up.
sysinfo = { version = "0.33", optional = true }
serde_json = { version = "1", optional = true }
proptest = { version = "1", optional = true }
# Required: `coordination` is built on tokio::sync (Notify, Semaphore, Mutex, watch, broadcast) and
# FiberHandle::{map, zip, or_else, interrupt_fork} / PubSub spawn onto the ambient Tokio runtime.
# `time` + `rt-multi-thread`: the `next` kernel's `TokioExecutor` (real timers, default runtime).
tokio = { version = "1.50.0", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }

[dev-dependencies]
trybuild = "1"
criterion = "0.8.2"
pollster = "1.0"
proptest = "1"
rstest = "0.26"
# Counting global allocator for `tests/next_kernel_alloc.rs` (the crate forbids `unsafe_code`, so
# the test cannot implement `GlobalAlloc` itself).
stats_alloc = "0.1"
tokio = { version = "1.50.0", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "core"
