[package]
name = "id_effect_messaging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Messaging for id_effect services: a broker-agnostic MessageBroker, in-memory broker, outbox, inbox and relay"
license.workspace = true
repository.workspace = true
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lib]
name = "id_effect_messaging"

[dependencies]
# `schema-serde`: typed payloads go `Schema` → `Unknown` → `serde_json::Value` → JSON bytes.
id_effect = { path = "../id_effect", version = "0.12.0", features = [
  "schema-serde",
] }
# The outbox and inbox tables run on any `SqlClient`; `migrate` ships their schema as a
# `Migrator` with its own tracking table (`migrator()`).
id_effect_sql = { path = "../id_effect_sql", version = "0.12.0", features = [
  "migrate",
] }
# Same floor as id_effect_sql (whose timestamp type it is).
jiff = "0.2.23"
serde_json = "1"

[dev-dependencies]
# The live PostgreSQL tests (tests/pg_outbox.rs) connect with the pg driver.
id_effect_sql = { path = "../id_effect_sql", features = ["pg", "migrate"] }
id_effect_tokio = { path = "../id_effect_tokio" }

[package.metadata.docs.rs]
all-features = true

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh. Platform: the Ledger reference
# app (examples/reference/ledger, CI-tested) depends on it (ADR 0010 Amendment 6, ADR 0012).
tier = "platform"
