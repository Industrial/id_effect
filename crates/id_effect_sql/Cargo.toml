[package]
name = "id_effect_sql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Driver-agnostic SQL client traits for id_effect — @effect/sql-style boundaries"
repository.workspace = true
readme = "README.md"
keywords = ["effect", "async", "sql", "database", "postgres"]
categories = ["asynchronous", "database"]

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[features]
# PostgreSQL driver (sqlx pool + PgSqlClient). `time` is the drivers' date-time type; the public
# API speaks jiff (`value::time_conv` converts).
pg = ["dep:sqlx", "dep:tokio", "dep:time", "sqlx/postgres"]
# `testing::arb_sql_value`: proptest strategies over the portable `SqlValue` domain.
proptest = ["dep:proptest", "id_effect/proptest"]
# `migrate`: versioned migrations (tracking table, advisory lock, one transaction each). sqlx
# supplies the source model (file naming, checksums, `sqlx::migrate!` embedding).
migrate = ["dep:sqlx", "sqlx/migrate"]

[dependencies]
id_effect = { path = "../id_effect", version = "0.8.0" }
# `#[derive(FromRow)]`, re-exported as `id_effect_sql::FromRow`.
id_effect_proc_macro = { path = "../id_effect_proc_macro", version = "0.8.0" }
# Value crates are unconditional: `SqlValue` has the same variants under every feature set.
# jiff: same floor as crates/id_effect.
jiff = "0.2.23"
uuid = { version = "1", default-features = false, features = ["std"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
serde = "1"
serde_json = "1"
time = { version = "0.3", optional = true, default-features = false, features = [
  "std",
] }
proptest = { version = "1", optional = true, default-features = false, features = [
  "std",
] }
sqlx = { version = "0.8", optional = true, default-features = false, features = [
  "runtime-tokio",
  "uuid",
  "time",
  "rust_decimal",
  "json",
] }
tokio = { version = "1.50.0", optional = true, features = ["rt", "sync"] }

[dev-dependencies]
id_effect_tokio = { path = "../id_effect_tokio" }
proptest = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "net"] }
# tests/from_row.rs: compile-fail cases of `#[derive(FromRow)]`.
trybuild = "1"

[[test]]
name = "pg"
required-features = ["pg"]

[[test]]
name = "migrate"
required-features = ["migrate", "pg"]

[[example]]
name = "030_migrate"
required-features = ["migrate", "pg"]

[package.metadata.docs.rs]
all-features = true

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "integration"
