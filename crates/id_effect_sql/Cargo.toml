[package]
name = "id_effect_sql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Driver-agnostic SQL client traits for id_effect — @effect/sql-style boundaries"
repository.workspace = true
readme = "README.md"
keywords = ["effect", "async", "sql", "database", "postgres"]
categories = ["asynchronous", "database"]

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[features]
# PostgreSQL driver (sqlx pool + PgSqlClient); formerly the id_effect_sql_pg crate.
pg = ["dep:sqlx", "dep:tokio"]

[dependencies]
id_effect = { path = "../id_effect", version = "0.6.0" }
sqlx = { version = "0.8", optional = true, default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "uuid",
] }
tokio = { version = "1.50.0", optional = true, features = ["rt", "sync"] }

[dev-dependencies]
axum = { version = "0.8" }
# Path-only: id_effect_axum publishes after id_effect_sql.
id_effect_axum = { path = "../id_effect_axum" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

id_effect_tokio = { path = "../id_effect_tokio" }
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "net"] }
rstest = "0.26"

[[example]]
name = "010_axum_sql"
path = "examples/010_axum_sql.rs"

[[test]]
name = "pg"
required-features = ["pg"]

[package.metadata.docs.rs]
all-features = true

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "integration"
