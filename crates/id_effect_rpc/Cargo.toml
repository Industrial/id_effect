[package]
name = "id_effect_rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Typed RPC for id_effect: procedures with access decisions, a serde contract, HTTP dispatch and a Rust client (ADR 0014)"
repository.workspace = true
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lib]
name = "id_effect_rpc"

# Every 0.12 feature is declared here once (r12-e12-1-promote), so the wave 2–5 leaves add
# modules behind them without editing this file. The design note
# .maestro/specs/releases/0.12/r12-rpc-design.md §8 says which leaf fills which feature.
[features]
default = ["client"]
# `client`: `RpcClient` over id_effect_platform's `HttpClientService` (batching adds same-tick
# batches in `client::http`).
client = ["dep:id_effect_platform", "dep:id_effect_config"]
# `postcard`: the binary codec negotiated per connection (D13; r12-e12-1-postcard).
postcard = ["dep:postcard"]
# `ws`: every kind over WebSocket frames, server (`transport::ws`, on id_effect_axum's realtime
# layer) and client (`client::ws`, tokio-tungstenite at the pin axum's realtime layer uses). The
# client dials `wss://` over rustls with the platform verifier (F40, r13-f-ws-client-tls):
# tokio-tungstenite's `__rustls-tls` takes our `ClientConfig` and brings no root store of its
# own (its `rustls-tls-*-roots` features would add a second root source).
ws = [
  "id_effect_axum/ws",
  "dep:tokio-tungstenite",
  "dep:tungstenite",
  "tokio-tungstenite/__rustls-tls",
  "dep:rustls",
  "dep:rustls-platform-verifier",
  "futures-util/sink",
]
# `sse`: subscriptions and server streams over server-sent events (`transport::sse`, `client::sse`).
sse = ["id_effect_axum/sse"]
# `events`: subscriptions backed by an id_effect_events `EventLog` (cursor = global position).
events = ["dep:id_effect_events"]
# `mesh`: the same contract node to node over the process mesh (postcard always).
# `id_effect_process` for the endpoint and reply processes (r12-e12-2-mesh-rpc).
mesh = ["postcard", "dep:id_effect_node", "dep:id_effect_process"]
# `channels`: topics and presence on mesh process groups, `JoinPolicy` (default deny; an adapter
# over id_effect_authz's axum-free policies).
# `id_effect_process` for the hub process each node runs (r12-e12-2-channels).
channels = ["mesh", "dep:id_effect_authz", "dep:id_effect_process"]
# `http3`: RPC over HTTP/3 on the host's shared QUIC endpoint (server and client).
http3 = ["client", "id_effect_axum/http3", "id_effect_platform/http3"]
# `webtransport`: two-way streams and subscriptions over WebTransport sessions.
# Implies `ws` (the connection logic and `RpcWsConfig` are shared) and `postcard` (the u32-BE
# length-prefixed records of each stream, `codec::postcard::{split_record, encode_record}`).
webtransport = ["http3", "ws", "postcard", "id_effect_axum/webtransport"]
# `test-util`: the in-process transport, contract fixtures and transport test helpers.
test-util = []

[dependencies]
axum = { version = "0.8.9", features = ["json", "query"] }
# Base64url (no padding) for cursors and resume session ids (`wire`); already in axum's tree.
base64 = "0.22.1"
# Streams: NDJSON bodies, the frame sinks of the WebSocket transport. Same pin as id_effect_axum.
futures-util = { version = "=0.3.34", default-features = false, features = [
  "std",
] }
http = "1"
http-body-util = "0.1"
id_effect = { path = "../id_effect", version = "0.12.0", features = [
  "schema-serde",
] }
id_effect_axum = { path = "../id_effect_axum", version = "0.12.0" }
# `#[rpc::service]` (re-exported as `id_effect_rpc::service`).
id_effect_rpc_macros = { path = "../id_effect_rpc_macros", version = "0.12.0" }
# 128-bit resume session ids (`wire::SessionId`); already in id_effect_axum's tree.
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# ETags of query results (r12-e12-1-kinds); already in id_effect_axum's tree.
sha2 = "0.10.9"
thiserror = "2"
# Deadlines, cancellation and stream channels of the call kinds.
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
# Optional dependencies of the features above.
id_effect_authz = { path = "../id_effect_authz", version = "0.12.0", optional = true }
# `Secret` bearer tokens of `HttpTransport::with_bearer` (feature `client`); already in
# id_effect_axum's tree.
id_effect_config = { path = "../id_effect_config", version = "0.12.0", optional = true, default-features = false }
id_effect_events = { path = "../id_effect_events", version = "0.12.0", optional = true }
id_effect_node = { path = "../id_effect_node", version = "0.12.0", optional = true }
id_effect_process = { path = "../id_effect_process", version = "0.12.0", optional = true }
id_effect_platform = { path = "../id_effect_platform", version = "0.12.0", optional = true }
postcard = { version = "=1.1.3", optional = true, default-features = false, features = [
  "use-std",
] }
tokio-tungstenite = { version = "=0.29.0", optional = true, default-features = false, features = [
  "connect",
  "handshake",
] }
tungstenite = { version = "=0.29.0", optional = true, default-features = false, features = [
  "handshake",
] }
# `wss://` of `client::ws` (feature `ws`): the rustls and the platform verifier
# id_effect_platform and reqwest already use (one copy of each in `cargo tree -d`; the rustls
# floor carries the security fixes named in id_effect_platform's manifest).
rustls = { version = "0.23.46", optional = true }
rustls-platform-verifier = { version = "=0.7.1", optional = true }

[dev-dependencies]
# Path-only dev-dependencies (cargo publish resolves path+version dev-deps on crates.io).
id_effect_events = { path = "../id_effect_events", features = ["pg"] }
# `tls`: tests/ws_h2.rs serves the RPC WebSocket over TLS HTTP/2 (RFC 8441, r13-f-ext-connect).
id_effect_axum = { path = "../id_effect_axum", features = ["tls"] }
# tests/channels_three_nodes.rs: three nodes on QUIC with mutual TLS (r12-e12-2-channels).
id_effect_node = { path = "../id_effect_node", features = ["quic"] }
id_effect_opentelemetry = { path = "../id_effect_opentelemetry" }
# `tls`: tests/ws_client_tls.rs serves `wss://` with a throwaway certificate.
id_effect_platform = { path = "../id_effect_platform", features = [
  "test-util",
  "tls",
] }
id_effect_test = { path = "../id_effect_test", features = ["sql"] }
id_effect_tokio = { path = "../id_effect_tokio" }
# tests/resume_property.rs (r12-e12-2-bidi-resume).
proptest = "1"
rstest = "0.26"
# tests/browser.rs (D12, r12-e12-3-webtransport): Chromium over CDP. headless_chrome, not
# chromiumoxide: its tungstenite (=0.29.0) is the tree's one; default `offline` (no fetching).
headless_chrome = "=1.0.22"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "io-util",
] }
tower = { version = "0.5", features = ["util"] }
# tests/ui.rs: compile-fail cases of `#[rpc::service]` (r12-e12-1-macro).
trybuild = "1"
# tests/{openapi_emit,asyncapi_emit}.rs validate the emitted documents against the OpenAPI 3.1
# and AsyncAPI 3.0 meta-schemas (r12-e12-4-openapi-asyncapi). The version id_effect_axum's tests
# already use; no default features, so no remote reference resolution.
jsonschema = { version = "=0.59.0", default-features = false }
# benches/{gate_rpc,h3_loss}.rs (r12-e12-5-benches): criterion, the loopback HTTP/1.1 and HTTP/2
# clients, and the HTTP/3 client on the platform's QUIC client config. Every version is the one
# already in the tree (id_effect_axum, id_effect_platform).
criterion = "0.8.2"
hyper = { version = "=1.12.0", default-features = false, features = [
  "client",
  "http1",
  "http2",
] }
hyper-util = { version = "0.1.12", features = ["tokio"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = [
  "logging",
  "tls12",
] }
quinn = { version = "=0.11.12", default-features = false, features = [
  "log",
  "runtime-tokio",
  "rustls-aws-lc-rs",
] }
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
bytes = "=1.12.1"
socket2 = "=0.6.5"

[[example]]
name = "010_json_greet"
path = "examples/010_json_greet.rs"

[[example]]
name = "020_rpc_tracing"
path = "examples/020_rpc_tracing.rs"

# 10,000 concurrent WebSocket server streams with heartbeats, RSS sampled (r12-e12-5-benches).
[[example]]
name = "streams_soak"
path = "examples/streams_soak.rs"
required-features = ["ws"]

# T12 gates: unary delta, batch pair (docs/benchmarks/gates.toml).
[[bench]]
name = "gate_rpc"
harness = false
required-features = ["postcard"]

# D9: HTTP/3 vs HTTP/2 p99 under 1 % loss + 5 ms (netem in bench.yml, userspace proxies locally).
[[bench]]
name = "h3_loss"
harness = false
required-features = ["http3"]

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh. Moved out of labs in 0.12
# (Amendment 8), promoted to `integration` by r12-e12-1-promote and to `platform` by
# r12-w7-relay: the Relay reference app depends on it and runs it in CI (ADR 0012 rule 4,
# check P).
tier = "platform"
