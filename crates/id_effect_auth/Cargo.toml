[package]
name = "id_effect_auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Authentication for id_effect services: password hashing, sessions, JWT, API-key and OIDC credentials"
license.workspace = true
repository.workspace = true
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lib]
name = "id_effect_auth"

[features]
default = []
# `SessionLayer`: a Tower layer that loads the request's session into `id_effect_axum`'s
# request capabilities.
axum = [
  "dep:id_effect_axum",
  "dep:http",
  "dep:tower-layer",
  "dep:tower-service",
]

[dependencies]
id_effect = { path = "../id_effect", version = "0.8.0" }
id_effect_axum = { path = "../id_effect_axum", version = "0.8.0", optional = true }
# RustCrypto argon2 (release spec 0.9.0 D5). 0.6 needs rustc 1.85, below the workspace MSRV.
argon2 = { version = "0.6.0", default-features = false, features = [
  "alloc",
  "getrandom",
  "password-hash",
] }
# Session tokens: 256 bits from the OS CSPRNG (the same major argon2's salts come from).
getrandom = "0.4.2"
# Saturating expiry arithmetic on `UtcDateTime`'s timestamp; same floor as id_effect's.
jiff = "0.2.23"
# Hands the blocking pool's result back to the fiber (already in id_effect's tree).
flume = "0.12"
# axum 0.8's `http`; `tower-*` are in id_effect_axum's tree already.
http = { version = "1", optional = true }
tower-layer = { version = "0.3.3", optional = true }
tower-service = { version = "0.3.3", optional = true }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1.50.0", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "io-util",
] }
tower = { version = "0.5.3", features = ["util"] }

[package.metadata.docs.rs]
all-features = true

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh. Integration until a reference app
# under examples/reference/ consumes it; then platform (ADR 0010 Amendment 5, ADR 0012).
tier = "integration"
