[package]
name = "id_effect_fsm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Typed finite-state machines, sagas, and session types for id_effect programs"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["effect", "fsm", "state-machine", "saga", "session-types"]
categories = ["data-structures"]

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dependencies]
id_effect = { path = "../id_effect", version = "0.5.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
rstest = "0.26"
tempfile = "3"

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "runtime"
