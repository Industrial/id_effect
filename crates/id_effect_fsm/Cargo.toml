[package]
name = "id_effect_fsm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Typed finite-state machines with Effect-valued transitions, derive(Fsm), sagas, and a gen_statem-style process behaviour for id_effect"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["effect", "fsm", "state-machine", "saga", "gen_statem"]
categories = ["data-structures", "asynchronous"]

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dependencies]
id_effect = { path = "../id_effect", version = "0.10.0" }
id_effect_proc_macro = { path = "../id_effect_proc_macro", version = "0.10.0" }
# FsmProcess behaviour (publish level 3: after id_effect_process).
id_effect_process = { path = "../id_effect_process", version = "0.10.0" }
thiserror = "2"

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "runtime"
