[package]
name = "id_effect_macro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Declarative macros for the `effect` crate (`ctx!`, `pipe!`, …). Procedural `effect!` is in `id_effect_proc_macro` — Rust cannot mix both in one proc-macro crate."
license.workspace = true
repository.workspace = true

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(coverage)',
  'cfg(feature, values("mock"))',
] }

[lib]
name = "id_effect_macro"
# Normal library: `macro_rules!` only. Expansions use `::id_effect::…` paths (no dependency on `effect`).

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "core"
