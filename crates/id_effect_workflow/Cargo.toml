[package]
name = "id_effect_workflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Durable workflows for id_effect services: journaled steps replayed on resume, on id_effect_sql and id_effect_jobs"
license.workspace = true
repository.workspace = true
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lib]
name = "id_effect_workflow"

[package.metadata.docs.rs]
all-features = true

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh (ADR 0010 Amendment 7).
tier = "integration"
