[package]
name = "id_effect_proc_macro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Procedural `effect!` macro for the `effect` crate (proc-macro only; declarative macros live in `id_effect_macro`)"
license.workspace = true
repository.workspace = true

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(coverage)',
  'cfg(feature, values("mock"))',
] }

[lib]
name = "id_effect_proc_macro"
proc-macro = true

[dev-dependencies]
# Path-only: published before `id_effect` / `id_effect_optics` (publish level-0).
# A version pin would require those crates on crates.io first — chicken-and-egg.
id_effect = { path = "../id_effect", features = ["schema-serde"] }
id_effect_optics = { path = "../id_effect_optics" }

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "core"
