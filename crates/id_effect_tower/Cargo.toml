[package]
name = "id_effect_tower"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Deprecated: merged into id_effect_axum::service (feature `tower`); re-export shim removed in 0.7"
license.workspace = true
repository.workspace = true

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(coverage)',
  'cfg(feature, values("mock"))',
] }

[lib]
name = "id_effect_tower"

[dependencies]
id_effect_axum = { path = "../id_effect_axum", version = "0.5.0", features = [
  "tower",
] }

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "merge"
merge_into = "id_effect_axum"
