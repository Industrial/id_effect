[package]
name = "id_effect_tower"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Tower Service bridge for `effect` programs (runs effects via id_effect_tokio)"
license.workspace = true
repository.workspace = true

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(coverage)',
  'cfg(feature, values("mock"))',
] }

[lib]
name = "id_effect_tower"

[dependencies]
id_effect = { path = "../id_effect", version = "0.5.0" }
id_effect_tokio = { path = "../id_effect_tokio", version = "0.5.0" }
tokio = { version = "1", features = ["sync"] }
# 0.5.0 does not build under minimal-version resolution (const / Identity::new).
tower = { version = "0.5.3", features = ["util"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "merge"
merge_into = "id_effect_axum"
