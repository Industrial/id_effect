[package]
name = "id_effect_mail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Outgoing mail for id_effect services: SMTP, the SendGrid API, templates and delivery through jobs"
license.workspace = true
repository.workspace = true
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lib]
name = "id_effect_mail"

[features]
# `MailPreviews`: the axum router at `/_mail/previews` rendering registered previews (msg.email#3).
preview = ["dep:axum"]
# `deliver_later` / `deliver_later_in`: the `DeliverMail` job and its handler (msg.email#5).
jobs = ["dep:id_effect_jobs", "dep:id_effect_sql"]
# `AccountMails`: id_effect_auth's `AccountNotifier` (verification and password reset mails from
# templates, sent directly through the `Mailer`, never through the jobs table) (sec.authn#8).
auth = ["dep:id_effect_auth"]

[dependencies]
id_effect = { path = "../id_effect", version = "0.12.0" }
# `SendGridMailer` posts through the `HttpClient` capability (release spec 0.10.0 D9), so it gets
# the 0.10 client defaults: connect and total timeouts, and retries of idempotent methods only.
id_effect_platform = { path = "../id_effect_platform", version = "0.12.0" }
# MIME building and the pooled SMTP transport (D9). No native-tls; no `dkim` (it pulls rsa,
# RUSTSEC-2023-0071 in deny.toml); no `hostname` (EHLO uses the configured name, the
# Message-ID the sender's domain). `builder` pulls quoted_printable, licensed 0BSD.
lettre = { version = "0.11.23", default-features = false, features = [
  "builder",
  "smtp-transport",
  "pool",
  "tokio1-rustls",
  "aws-lc-rs",
  "webpki-roots",
] }
# SendGrid v3 request bodies and attachment content; the versions already in the workspace lock.
serde_json = "1"
base64 = "0.22.1"
# Mail templates (release spec 0.10.0 D4): runtime templates, so the preview page re-reads them
# from disk. `loader` for owned sources and the directory loader. Apache-2.0.
minijinja = { version = "2", features = ["loader"] }
# Template contexts are any `Serialize` value.
serde = "1"
# Feature `preview`: the preview router (routing and extractors only).
axum = { version = "0.8.9", default-features = false, optional = true }
# Feature `jobs`: the queue the `DeliverMail` job runs on (mail depends on jobs, never the
# reverse), and the `SqlTransaction` `deliver_later_in` enqueues with.
id_effect_jobs = { path = "../id_effect_jobs", version = "0.12.0", optional = true }
id_effect_sql = { path = "../id_effect_sql", version = "0.12.0", optional = true }
# Feature `auth`: the `AccountNotifier` trait `AccountMails` implements (mail depends on auth,
# never the reverse).
id_effect_auth = { path = "../id_effect_auth", version = "0.12.0", features = [
  "accounts",
], optional = true }

[dev-dependencies]
# Runs the transports' effects on the test's tokio runtime; the in-process fake SMTP server
# listens on a tokio socket.
id_effect_tokio = { path = "../id_effect_tokio" }
tokio = { version = "1.50.0", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "io-util",
  "time",
] }
wiremock = "0.6"
# tests/mailpit.rs: the Mailpit container; tests/preview.rs: the in-process HTTP client.
id_effect_test = { path = "../id_effect_test", features = ["http"] }
# tests/mailpit.rs reads Mailpit's HTTP API (plain HTTP, the version already in the lock).
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
# tests/mail.rs: `deliver_later_in` on a live PostgreSQL transaction.
id_effect_sql = { path = "../id_effect_sql", features = ["pg"] }

[[example]]
name = "010_mail"
required-features = ["jobs"]

[package.metadata.docs.rs]
all-features = true

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh. Platform: the Ledger reference
# app (examples/reference/ledger, CI-tested) depends on it (ADR 0010 Amendment 6, ADR 0012).
tier = "platform"
