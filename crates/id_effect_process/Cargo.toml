[package]
name = "id_effect_process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "BEAM/OTP-style processes, links, monitors, and supervision trees for id_effect"
license.workspace = true
repository.workspace = true
keywords = ["effect", "actor", "supervision", "otp", "process"]
categories = ["asynchronous", "concurrency"]

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lib]
name = "id_effect_process"

[dependencies]
id_effect = { path = "../id_effect", version = "0.6.0" }

[dev-dependencies]
pollster = "0.4"
tokio = { version = "1.50.0", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
] }

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "runtime"
