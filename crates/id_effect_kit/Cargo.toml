[package]
name = "id_effect_kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "One front door to id_effect: a single dependency with feature flags per battery and a prelude"
license.workspace = true
repository.workspace = true
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lib]
name = "id_effect_kit"

[features]
default = []
# HTTP: `kit::axum` (id_effect_axum: typed routes, Problem+JSON, middleware) and its prelude
# items. With `authz`, also its route guards; with `redis`, the Redis rate-limit store; with
# `mail`, the mail preview routes.
web = [
  "dep:id_effect_axum",
  "id_effect_authz?/axum",
  "id_effect_redis?/rate-limit",
  "id_effect_mail?/preview",
  "id_effect_i18n?/axum",
  "dep:axum",
  "dep:tower-layer",
  "dep:tower-service",
]
# OpenAPI 3.1 from the typed routes, `/openapi.json` and `/docs` (id_effect_axum `openapi`).
openapi = ["web", "id_effect_axum/openapi"]
# SQL without a driver: `kit::sql` (id_effect_sql: `SqlClient`, transactions, `FromRow`,
# `TestSqlClient`). Every `sql-*`, `migrate` and `repository` feature turns it on. With `auth`,
# `sql-pg` also adds id_effect_auth's `PgSessionStore`; with `otel`,
# `kit::otel::instrumented_sql_layer` (a `db.query` span per statement).
sql = ["dep:id_effect_sql", "id_effect_opentelemetry?/sql"]
# PostgreSQL: `kit::sql` with its `pg` driver (`kit::sql::pg`).
sql-pg = ["sql", "id_effect_sql/pg", "id_effect_auth?/pg"]
# SQLite: `kit::sql` with its `sqlite` driver (bundled libsqlite3; `kit::sql::sqlite`).
sql-sqlite = ["sql", "id_effect_sql/sqlite"]
# MySQL: `kit::sql` with its `mysql` driver (`kit::sql::mysql`).
sql-mysql = ["sql", "id_effect_sql/mysql"]
# Versioned migrations: `kit::sql::migrate` (`migrate::run`, `migrate::layer`, `Migrator`).
# With `test`, also id_effect_test's migrated template databases.
migrate = ["sql", "id_effect_sql/migrate", "id_effect_test?/migrate"]
# Entities and repositories: `#[derive(Entity)]`, `Repository<T>` over sea-query statements.
repository = ["sql", "id_effect_sql/repository"]
# Hash-chained audit log appended in the caller's transaction (`kit::sql::audit`; PostgreSQL).
audit = ["sql", "id_effect_sql/audit", "id_effect_admin?/audit"]
# OpenTelemetry export: `kit::otel` (id_effect_opentelemetry, OTLP on, config loading on).
otel = ["dep:id_effect_opentelemetry", "id_effect_opentelemetry/config"]
# Distribution: `kit::node` (id_effect_node) with its TLS TCP transport (`TcpTransport::tls`, mutual
# TLS from PEM files, feature `tls-tcp`) and the certificates of `kit::platform::tls`; with `web`,
# also id_effect_axum's `cluster` module.
cluster = [
  "process",
  "dep:id_effect_node",
  "id_effect_node/tls-tcp",
  "id_effect_axum?/cluster",
  "dep:id_effect_platform",
  "id_effect_platform/tls",
  "id_effect_rpc?/channels",
  "id_effect_rpc?/mesh",
]
# RPC (ADR 0014): `kit::rpc` (id_effect_rpc: `#[rpc::service]`, `RpcGroup`, `RpcServer` under
# `/rpc`, the generated clients and their HTTP transport) and its prelude items, on top of `web`.
# The `#[rpc::service]` expansion names `::id_effect_rpc`: keep that crate as a dependency too.
# With `cluster`, also channels and mesh RPC (`id_effect_rpc/channels`, `id_effect_rpc/mesh`);
# with `events`, subscriptions backed by an event log; with `http3`, RPC over HTTP/3.
rpc = ["web", "dep:id_effect_rpc", "id_effect_rpc/client"]
# Every RPC kind over one WebSocket (`GET /rpc/ws`, resume across reconnects) and subscriptions
# and server streams over server-sent events, client and server, on top of `rpc`.
rpc-ws = ["rpc", "id_effect_rpc/ws", "id_effect_rpc/sse"]
# HTTP/3 (ADR 0014 D4): id_effect_axum's TLS on TCP and HTTP/3 on the same port
# (`HostConfig::http3`, on by default; `Alt-Svc` on TCP responses) and `kit::platform::tls`, on
# top of `web`. With `rpc`, RPC over HTTP/3; with `http-client`, the platform HTTP/3 client
# (`HttpClientConfig::http3`).
http3 = [
  "web",
  "id_effect_axum/http3",
  "dep:id_effect_platform",
  "id_effect_platform/tls",
  "id_effect_rpc?/http3",
  "id_effect_platform?/http3",
]
# WebTransport sessions carrying RPC two-way streams and subscriptions (with resume), on top of
# `http3` and `rpc-ws`.
webtransport = [
  "http3",
  "rpc-ws",
  "id_effect_axum/webtransport",
  "id_effect_rpc/webtransport",
]
# Local processes (ADR 0009): `kit::process` (id_effect_process: `Process`, `ProcessNode`,
# typed mailboxes, links, monitors, supervision trees), the layer the mesh distributes. Turned on
# by `cluster`.
process = ["dep:id_effect_process"]
# The QUIC mesh transport (`kit::node::transport::quic`, always mutual TLS) next to TLS TCP, on
# top of `cluster`.
mesh-mtls = ["cluster", "id_effect_node/quic"]
# Peer discovery from Kubernetes EndpointSlices (`kit::node::KubernetesDiscovery`), on top of
# `cluster`.
kubernetes = ["cluster", "id_effect_node/kubernetes"]
# Durable workflows: `kit::workflow` (id_effect_workflow: journaled steps, activities as jobs,
# durable timers, signals), on top of `sql` and `jobs`.
workflow = ["dep:id_effect_workflow", "sql", "jobs"]
# Authentication: `kit::auth` (id_effect_auth with its Axum middleware and JWT issue / verify:
# passwords, sessions, API keys, `Authenticate`). Implies `web`. With `redis`, also the Redis
# session store.
auth = [
  "web",
  "dep:id_effect_auth",
  "id_effect_auth/axum",
  "id_effect_auth/jwt",
  "id_effect_redis?/session",
]
# OpenID Connect login (discovery, PKCE, code exchange) and JWKS key sets, on top of `auth`.
auth-oidc = ["auth", "id_effect_auth/oidc"]
# TOTP second factor and recovery codes, on top of `auth`.
auth-totp = ["auth", "id_effect_auth/totp"]
# Authorization: `kit::authz` (id_effect_authz: policies, RBAC, `authorize`); with `web`, also
# the route guards.
authz = ["dep:id_effect_authz"]
# Redis: `kit::redis` (id_effect_redis: client layer, cache backend, typed stores, pub/sub).
redis = ["dep:id_effect_redis"]
# Configuration from HashiCorp Vault (`kit::config::vault`).
config-vault = ["id_effect_config/vault"]
# Background jobs: `kit::jobs` (id_effect_jobs: the PostgreSQL queue, `MemoryJobQueue`, workers,
# retries, `enqueue_in` the caller's transaction). With `mail`, also `deliver_later`; with
# `console`, the console's jobs panel.
jobs = ["dep:id_effect_jobs", "id_effect_mail?/jobs", "id_effect_console?/jobs"]
# Cron entries that enqueue jobs, run once per cluster (`CronLeader`, `enqueue_on_tick`), on top
# of `jobs`.
jobs-cron = ["jobs", "id_effect_jobs/cron"]
# Messaging: `kit::messaging` (id_effect_messaging: `MessageBroker`, the in-memory broker, the
# transactional outbox, inbox and relay).
messaging = ["dep:id_effect_messaging"]
# The `MessageBroker` on Redis Streams (`kit::redis::RedisStreamsBroker`), on top of `redis` and
# `messaging`.
redis-streams = ["redis", "messaging", "id_effect_redis/streams"]
# Outgoing mail: `kit::mail` (id_effect_mail: SMTP, SendGrid, minijinja templates,
# `TestMailbox`). With `jobs`, `deliver_later`; with `web`, the preview routes.
mail = ["dep:id_effect_mail"]
# Operator console: `kit::console` (id_effect_console: fibers, supervisors, metrics, health and
# the log level, behind an authz guard). Implies `web` and `authz`; with `jobs`, the jobs panel.
console = ["web", "authz", "dep:id_effect_console"]
# Object storage: `kit::storage` (id_effect_storage: local file system and in-memory stores,
# signed URLs).
storage = ["dep:id_effect_storage"]
# Amazon S3 and S3-compatible servers (`kit::storage::S3Store`), on top of `storage`.
storage-s3 = ["storage", "id_effect_storage/s3"]
# Outbound HTTP: `kit::platform` (id_effect_platform: the `HttpClient` capability, the reqwest
# client, retries). With `otel`, also `kit::otel::TracedHttpClient` (and its `layer`); with `mail`, what
# `SendGridMailer` sends through.
http-client = ["dep:id_effect_platform", "id_effect_opentelemetry?/platform"]
# Structured logging: `kit::logger` (id_effect_logger: `EffectLogger`, backends, the
# `RedactionPolicy`).
logger = ["dep:id_effect_logger"]
# Event sourcing: `kit::events` (id_effect_events: event store, `SqlEventJournal`, projections,
# snapshots, checkpointed subscriptions).
events = ["dep:id_effect_events", "id_effect_rpc?/events"]
# User accounts on top of `auth` and `mail`: id_effect_auth's `Accounts`, `AccountRoutes` and
# `PgAccountTokenStore` (PostgreSQL), and id_effect_mail's `AccountMails` (the sign-up,
# verification and reset mail).
auth-accounts = [
  "auth",
  "mail",
  "id_effect_auth/accounts",
  "id_effect_mail/auth",
]
# AI (ADR 0015 D6, D9): `kit::ai` (id_effect_ai: provider-neutral chat and streaming with the
# OpenAI and Anthropic vendors, typed tools, structured output, the bounded tool loop) and its
# prelude items. Prompts are not logged unless `AiConfig::dangerous_log_prompts` is taken.
ai = [
  "dep:id_effect_ai",
  "id_effect_ai/openai",
  "id_effect_ai/anthropic",
  "id_effect_ai/tools",
]
# The `Embedder` capability (`kit::ai::embeddings`: OpenAI and Ollama, similarity helpers), on top
# of `ai`.
embeddings = ["ai", "id_effect_ai/embeddings", "id_effect_ai/ollama"]
# MCP server and client (`kit::ai::mcp`: stdio and the guarded Streamable HTTP endpoint
# `McpEndpoint`), on top of `ai` and `web`.
mcp = ["ai", "web", "authz", "id_effect_ai/mcp", "id_effect_ai/mcp-http"]
# Server-rendered UI: `kit::ui` (id_effect_axum's `ui`: maud views, components, layouts, htmx
# helpers, forms bound to `Schema` errors), on top of `web`. With `i18n`, translated messages
# render as maud markup.
ui = ["web", "id_effect_axum/ui", "id_effect_i18n?/maud"]
# Internationalization: `kit::i18n` (id_effect_i18n: Fluent catalogs, CLDR plurals,
# `CurrentLocale`, translated `Schema` messages). With `web`, the `Accept-Language` layer; with
# `ui`, maud rendering; with `admin`, translated admin labels.
i18n = ["dep:id_effect_i18n", "id_effect_i18n/schema", "id_effect_admin?/i18n"]
# The admin back office: `kit::admin` (id_effect_admin: `AdminSite`, mounted only behind a guard,
# per-entity permissions), on top of `ui`, `authz` and `repository`. With `audit`, admin changes
# go to the hash-chained audit log; with `i18n`, translated labels.
admin = ["ui", "authz", "repository", "dep:id_effect_admin"]
# Tenancy (ADR 0015 D10): `kit::tenancy`, one `TenantResolver` feeding both the authorization
# tenant (`TenantId`, a `TenantScope`) and the SQL tenant (`CurrentTenant`), on top of `authz`
# and `repository`; with `web`, the `TenancyLayer` that sets both per request.
tenancy = ["authz", "repository"]
# Test support: `kit::test` (id_effect_test: containers, isolated PostgreSQL databases,
# fixtures, the in-process HTTP client, OpenAPI contract checks). For tests: enable it on a
# `[dev-dependencies]` entry of id_effect_kit, not in `[dependencies]`. Not part of `full`.
test = [
  "dep:id_effect_test",
  "id_effect_test/sql",
  "id_effect_test/fixtures",
  "id_effect_test/http",
  "id_effect_test/contract",
  "id_effect_test/fault",
  "id_effect_ai?/test-util",
  "id_effect_admin?/test-util",
]
# Every battery a program ships with; builds without Docker or system libraries. `test` is
# left out: it belongs to dev-dependencies.
full = [
  "web",
  "openapi",
  "sql-pg",
  "sql-sqlite",
  "sql-mysql",
  "migrate",
  "repository",
  "audit",
  "otel",
  "cluster",
  "mesh-mtls",
  "kubernetes",
  "workflow",
  "auth",
  "auth-oidc",
  "auth-totp",
  "authz",
  "redis",
  "config-vault",
  "jobs",
  "jobs-cron",
  "messaging",
  "redis-streams",
  "mail",
  "console",
  "storage",
  "storage-s3",
  "http-client",
  "logger",
  "events",
  "auth-accounts",
  "rpc",
  "rpc-ws",
  "http3",
  "webtransport",
  "process",
  "ai",
  "embeddings",
  "mcp",
  "ui",
  "i18n",
  "admin",
  "tenancy",
]

[dependencies]
id_effect = { path = "../id_effect", version = "0.12.0" }
id_effect_cli = { path = "../id_effect_cli", version = "0.12.0", default-features = false }
id_effect_config = { path = "../id_effect_config", version = "0.12.0" }
id_effect_axum = { path = "../id_effect_axum", version = "0.12.0", optional = true }
id_effect_sql = { path = "../id_effect_sql", version = "0.12.0", optional = true }
id_effect_opentelemetry = { path = "../id_effect_opentelemetry", version = "0.12.0", optional = true }
id_effect_node = { path = "../id_effect_node", version = "0.12.0", optional = true }
id_effect_auth = { path = "../id_effect_auth", version = "0.12.0", optional = true }
id_effect_authz = { path = "../id_effect_authz", version = "0.12.0", optional = true }
id_effect_redis = { path = "../id_effect_redis", version = "0.12.0", optional = true }
id_effect_test = { path = "../id_effect_test", version = "0.12.0", optional = true }
id_effect_jobs = { path = "../id_effect_jobs", version = "0.12.0", optional = true }
id_effect_messaging = { path = "../id_effect_messaging", version = "0.12.0", optional = true }
id_effect_mail = { path = "../id_effect_mail", version = "0.12.0", optional = true }
id_effect_console = { path = "../id_effect_console", version = "0.12.0", optional = true }
id_effect_storage = { path = "../id_effect_storage", version = "0.12.0", optional = true }
id_effect_events = { path = "../id_effect_events", version = "0.12.0", optional = true }
id_effect_platform = { path = "../id_effect_platform", version = "0.12.0", optional = true }
id_effect_logger = { path = "../id_effect_logger", version = "0.12.0", optional = true }
id_effect_workflow = { path = "../id_effect_workflow", version = "0.12.0", optional = true }
id_effect_rpc = { path = "../id_effect_rpc", version = "0.12.0", optional = true, default-features = false }
id_effect_process = { path = "../id_effect_process", version = "0.12.0", optional = true }
id_effect_ai = { path = "../id_effect_ai", version = "0.12.0", optional = true }
id_effect_i18n = { path = "../id_effect_i18n", version = "0.12.0", optional = true }
id_effect_admin = { path = "../id_effect_admin", version = "0.12.0", optional = true }
# `tenancy` with `web`: the `TenancyLayer` and the `Tenancy` extractor (the versions
# id_effect_axum already uses).
axum = { version = "0.8.9", optional = true, default-features = false }
tower-layer = { version = "0.3.3", optional = true }
tower-service = { version = "0.3.3", optional = true }

[dev-dependencies]
axum = "0.8.9"
# tests/posture.rs: a certificate carrying the `id-effect dev` organization (C13), with the
# same rcgen the platform issues certificates with.
rcgen = { version = "=0.14.10", default-features = false, features = [
  "aws_lc_rs",
  "pem",
] }
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }

[package.metadata.docs.rs]
all-features = true

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh. Platform (ADR 0010 Amendment 4,
# ADR 0012): the Ledger reference app under examples/reference/ depends on it.
tier = "platform"
