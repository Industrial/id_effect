[package]
name = "id_effect_authz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Authorization for id_effect services: roles and permissions, named and resource policies, route guards"
license.workspace = true
repository.workspace = true
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lib]
name = "id_effect_authz"

[features]
default = []
# Route guards (`guard` module): a Tower layer and `.authorize(guard)` on axum and typed routes.
axum = [
  "dep:axum",
  "dep:id_effect_axum",
  "dep:tower-layer",
  "dep:tower-service",
]
# Test helpers (`testing` module): `AuthzTest`.
testing = []

[dependencies]
id_effect = { path = "../id_effect", version = "0.10.1" }
# Decision events are serialisable (an audit log persists them).
serde = { version = "1", features = ["derive"] }
# Claim values of a `Principal` (JWT / OIDC claims are JSON); Problem Details bodies.
serde_json = "1"
id_effect_axum = { path = "../id_effect_axum", version = "0.10.1", optional = true }
axum = { version = "0.8", optional = true }
# Already in axum's dependency tree.
tower-layer = { version = "0.3.3", optional = true }
tower-service = { version = "0.3.3", optional = true }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }

[[example]]
name = "020_route_guards"
required-features = ["axum", "testing"]

[[test]]
name = "guards"
required-features = ["axum", "testing"]

[package.metadata.docs.rs]
all-features = true

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh. Platform: the Ledger reference
# app (examples/reference/ledger, CI-tested) depends on it (ADR 0010 Amendment 5, ADR 0012).
tier = "platform"
