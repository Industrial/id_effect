[package]
name = "id_effect_authz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Authorization for id_effect services: roles and permissions, named and resource policies, route guards"
license.workspace = true
repository.workspace = true
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lib]
name = "id_effect_authz"

[dependencies]
id_effect = { path = "../id_effect", version = "0.8.0" }
# Claim values of a `Principal` (JWT / OIDC claims are JSON).
serde_json = "1"

[package.metadata.docs.rs]
all-features = true

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh. Integration until a reference app
# under examples/reference/ consumes it; then platform (ADR 0010 Amendment 5, ADR 0012).
tier = "integration"
