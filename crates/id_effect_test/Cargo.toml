[package]
name = "id_effect_test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Integration-test support for id_effect: effect-native containers, per-test database isolation, fixtures"
license.workspace = true
repository.workspace = true
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[features]
# `Postgres::sql_layer`: a ready `SqlClient` (id_effect_sql `pg`) over the started container.
sql = ["dep:id_effect_sql", "id_effect_sql/pg"]
# `db::migrate`: an app's migrations as the setup of a `TemplateDb`.
migrate = ["sql", "id_effect_sql/migrate"]
# `fixtures`: `Fixture` / `Factory` with Schema-arbitrary defaults (proptest generators).
fixtures = ["sql", "dep:proptest", "id_effect/proptest"]
# `http`: the in-process `TestClient` over a tower `Service` (an axum `Router`), without axum.
http = [
  "dep:tower",
  "dep:http",
  "dep:http-body",
  "dep:http-body-util",
  "dep:bytes",
  "dep:serde",
  "dep:serde_json",
]
# `contract`: contract testing — a `TestResponse` checked against the response schema an OpenAPI
# document declares for its operation and status.
contract = ["http", "dep:jsonschema"]

[lib]
name = "id_effect_test"

[dependencies]
id_effect = { path = "../id_effect", version = "0.9.0" }
id_effect_sql = { path = "../id_effect_sql", version = "0.9.0", optional = true }
# Containers are started through testcontainers (TLS-free: local Docker socket or plain TCP).
testcontainers = { version = "0.28", default-features = false }
# Already in the tree through testcontainers: container inspection, ping and the reaper's
# host config. Default features off (testcontainers selects the transports).
bollard = { version = "0.21", default-features = false }
# The crate's own Docker runtime (every Docker call runs on it, whatever runs the effect).
tokio = { version = "1.50.0", features = [
  "rt-multi-thread",
  "time",
  "sync",
  "io-util",
] }
# Feature `fixtures`: the seeded generator behind `Factory` (id_effect's `from_schema` strategies).
proptest = { version = "1", optional = true, default-features = false, features = [
  "std",
] }
# Feature `http`: requests and responses as `http` types, sent to any tower `Service`.
tower = { version = "0.5.3", optional = true, default-features = false, features = [
  "util",
] }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
# Feature `contract`: JSON Schema 2020-12 validation of response bodies (MIT, rust-version 1.85;
# already id_effect_axum's meta-schema test dependency). Local `$ref`s only, so no default
# features (no remote reference resolution).
jsonschema = { version = "0.59", optional = true, default-features = false }

[dev-dependencies]
id_effect_tokio = { path = "../id_effect_tokio" }
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "time"] }
# tests/db.rs, tests/fixtures.rs, examples/020_isolated_db.rs: container-free SQLite databases.
id_effect_sql = { path = "../id_effect_sql", features = ["sqlite"] }
# tests/http.rs and the `http` docs: an axum router under the test client.
axum = { version = "0.8", default-features = false, features = ["json"] }
serde_json = "1"
# tests/http.rs: hand-written services (a failing one, a failing body).
tower = "0.5.3"
http-body = "1"
bytes = "1"
# tests/contract.rs: typed routes and the OpenAPI document generated from them. Path-only: cargo
# publish resolves path+version dev-deps on crates.io.
id_effect_axum = { path = "../id_effect_axum", features = ["openapi"] }

[[example]]
name = "010_containers"
required-features = ["sql"]

[[example]]
name = "020_isolated_db"
required-features = ["fixtures"]

[package.metadata.docs.rs]
all-features = true

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh. Platform: the Ledger reference
# app (examples/reference/ledger, CI-tested) depends on it (ADR 0010 Amendment 5, ADR 0012).
tier = "platform"
