[package]
name = "id_effect_tokio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Tokio runtime adapter for id_effect: TokioRuntime (sleep, yield, fork on the blocking pool)"
license.workspace = true
repository.workspace = true
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(coverage)',
  'cfg(feature, values("mock"))',
] }

[lib]
name = "id_effect_tokio"

[dependencies]
id_effect = { path = "../id_effect", version = "0.6.0" }
tokio = { version = "1.50.0", features = [
  "rt",
  "rt-multi-thread",
  "time",
  "sync",
] }

[[bench]]
name = "startup_first_spawn"
harness = false

[dev-dependencies]
criterion = "0.8.2"
pollster = "1.0"

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "core"
