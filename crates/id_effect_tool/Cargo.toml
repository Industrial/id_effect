[package]
name = "id_effect_tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `id-effect` command: `id-effect new` scaffolds a service, worker, CLI or cluster node on id_effect_kit; `id-effect migrate` runs SQL migrations"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["effect", "scaffold", "generator", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lib]
name = "id_effect_tool"

# The crates.io name `id-effect` would collide with `id_effect` (cargo treats `-` and `_` alike),
# so the package is `id_effect_tool` and the binary keeps the short name.
[[bin]]
name = "id-effect"
path = "src/bin/id-effect.rs"

[dependencies]
clap = { version = "4.5", default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
] }
# `id-effect migrate`: the migration engine on the PostgreSQL driver, run on a tokio runtime.
id_effect = { path = "../id_effect", version = "0.12.0" }
id_effect_sql = { path = "../id_effect_sql", version = "0.12.0", features = [
  "pg",
  "migrate",
] }
id_effect_tokio = { path = "../id_effect_tokio", version = "0.12.0" }
# `id-effect rpc gen ts`: the service contract model (`id_effect_rpc::contract`); no client.
id_effect_rpc = { path = "../id_effect_rpc", version = "0.12.0", default-features = false }
# jiff: `migrate new` timestamps and `migrate status` times (same floor as id_effect_sql).
jiff = "0.2.23"
# `id-effect dev`: the localhost development CA and its 13-day ECDSA P-256 certificate
# (WebTransport `serverCertificateHashes`), with the rcgen the platform issues certificates with;
# sha2 for the certificate hash it prints.
rcgen = { version = "=0.14.10", default-features = false, features = [
  "aws_lc_rs",
  "pem",
] }
serde_json = "1"
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "3"
# tests/dev_cert.rs: the kit's posture recognizes the dev certificate (C13), x509-parser reads
# its validity and key back (path-only dev-dependency).
id_effect_kit = { path = "../id_effect_kit" }
x509-parser = "=0.18.1"
# tests/rpc_gen_ts.rs: the test service the generated TypeScript client calls over HTTP,
# WebSocket and SSE on loopback (path-only: cargo publish resolves path+version dev-deps).
axum = "0.8.9"
id_effect_axum = { path = "../id_effect_axum" }
# `postcard` too: `ws` alone leaves an unused import in transport/ws.rs (reported to the
# coordinator, not this leaf's file).
id_effect_rpc = { path = "../id_effect_rpc", default-features = false, features = [
  "ws",
  "sse",
  "postcard",
] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "time",
] }

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh (ADR 0010 Amendment 4).
tier = "integration"
