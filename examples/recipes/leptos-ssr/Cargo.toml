# Leptos SSR + hydration on the id_effect axum host (0.13 D4, r13-e9-5-leptos).
#
# A recipe, not a published crate: outside the workspace (root `Cargo.toml` `exclude`), with its
# own `Cargo.lock`, built and tested by the CI job `recipe-leptos`. No npm and no node_modules:
# the browser half is this same crate compiled for `wasm32-unknown-unknown` and bound with
# `wasm-bindgen-cli` (the version pinned below); `scripts/build-site.sh` does both. See README.md.
[package]
name = "leptos_ssr"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Recipe: Leptos server-side rendering with hydration, served by the id_effect axum host, calling an id_effect RPC service"

[lib]
# An `rlib` for the server and the tests. The wasm build asks for a `cdylib` itself
# (`cargo rustc --crate-type cdylib` in scripts/build-site.sh), so native builds never link the
# whole server into a shared library.
crate-type = ["rlib"]

[[bin]]
name = "leptos_ssr"
path = "src/main.rs"
required-features = ["ssr"]

[features]
default = ["ssr"]
# The server: Leptos SSR through leptos_axum, mounted on id_effect_axum's typed router behind its
# SecurityLayer, the `Notes` RPC service and its generated client.
ssr = [
  "leptos/ssr",
  "leptos/nonce",
  "dep:leptos_axum",
  "dep:any_spawner",
  "dep:id_effect",
  "dep:id_effect_axum",
  "dep:id_effect_config",
  "dep:id_effect_platform",
  "dep:id_effect_rpc",
  "dep:axum",
  "dep:rand",
  "dep:tokio",
]
# The browser: hydrates the server-rendered HTML (`wasm32-unknown-unknown` only).
hydrate = ["leptos/hydrate", "dep:wasm-bindgen", "dep:console_error_panic_hook"]

[dependencies]
# Exact pins: Leptos is pre-1.0 (0.13 rules); leptos_axum 0.8.10 is the release built against
# leptos 0.8.22 and axum 0.8 (the axum id_effect_axum uses).
leptos = { version = "=0.8.22" }
serde = { version = "1", features = ["derive"] }

leptos_axum = { version = "=0.8.10", optional = true }
# Leptos's executor, set to tokio once at startup (the version leptos_axum uses).
any_spawner = { version = "=0.3.0", optional = true, features = ["tokio"] }
id_effect = { path = "../../../crates/id_effect", optional = true, features = [
  "schema-serde",
] }
id_effect_axum = { path = "../../../crates/id_effect_axum", optional = true }
id_effect_config = { path = "../../../crates/id_effect_config", optional = true, default-features = false }
id_effect_platform = { path = "../../../crates/id_effect_platform", optional = true }
id_effect_rpc = { path = "../../../crates/id_effect_rpc", optional = true }
axum = { version = "0.8.9", optional = true }
# The service token generated at startup when none is configured (the version id_effect_axum uses).
rand = { version = "0.9", optional = true }
tokio = { version = "1", optional = true, features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
] }

# Must equal the wasm-bindgen-cli that binds the wasm (CI installs exactly this version).
wasm-bindgen = { version = "=0.2.129", optional = true }
console_error_panic_hook = { version = "=0.1.7", optional = true }

[dev-dependencies]
# tests/recipe.rs `leptos_recipe_hydrates_in_browser` (ID_EFFECT_REQUIRE_BROWSER=1): Chromium over
# CDP, the version id_effect_rpc's browser test uses.
headless_chrome = "=1.0.22"
http-body-util = "0.1"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
