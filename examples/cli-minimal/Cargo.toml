[package]
name = "cli_minimal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Starter template for id_effect CLIs — clap + id_effect_cli + id_effect_config (Secret)"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# ConfigError is large; this example returns Result<_, ConfigError> like id_effect_config.
result_large_err = "allow"

[lib]
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
] }
id_effect = { path = "../../crates/id_effect", version = "0.10.0" }
id_effect_cli = { path = "../../crates/id_effect_cli", version = "0.10.0", features = [
  "clap",
  "completions",
] }
id_effect_config = { path = "../../crates/id_effect_config", version = "0.10.0" }

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh
tier = "example"
