[package]
name = "book_snippets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Compiles the id_effect book's Rust snippets as doctests (DX KPI K5)"

[lints.rust]
unsafe_code = "forbid"

[lib]
path = "src/lib.rs"

# Every crate a book chapter may use. Doctests compile against these.
[dependencies]
id_effect = { path = "../../crates/id_effect", version = "0.7.0", features = [
  "schema-serde",
  "schema-regex",
  "proptest",
] }
id_effect_axum = { path = "../../crates/id_effect_axum", version = "0.7.0", features = [
  "tower",
] }
id_effect_cli = { path = "../../crates/id_effect_cli", version = "0.7.0" }
id_effect_config = { path = "../../crates/id_effect_config", version = "0.7.0" }
id_effect_fp = { path = "../../crates/id_effect_fp", version = "0.7.0" }
id_effect_logger = { path = "../../crates/id_effect_logger", version = "0.7.0" }
id_effect_resilience = { path = "../../crates/id_effect_resilience", version = "0.7.0" }
id_effect_sql = { path = "../../crates/id_effect_sql", version = "0.7.0", features = [
  "pg",
] }
id_effect_fsm = { path = "../../crates/id_effect_fsm", version = "0.7.0" }
id_effect_kit = { path = "../../crates/id_effect_kit", version = "0.7.0", features = [
  "full",
] }
id_effect_node = { path = "../../crates/id_effect_node", version = "0.7.0" }
id_effect_opentelemetry = { path = "../../crates/id_effect_opentelemetry", version = "0.7.0" }
id_effect_optics = { path = "../../crates/id_effect_optics", version = "0.7.0" }
id_effect_platform = { path = "../../crates/id_effect_platform", version = "0.7.0" }
id_effect_process = { path = "../../crates/id_effect_process", version = "0.7.0" }
id_effect_tokio = { path = "../../crates/id_effect_tokio", version = "0.7.0" }
cli_minimal = { path = "../cli-minimal" }
axum = "0.8"
clap = { version = "4.5", default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
] }
opentelemetry = { version = "0.32", default-features = false, features = [
  "trace",
  "metrics",
  "logs",
] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = [
  "trace",
  "metrics",
  "logs",
  "rt-tokio",
  "testing",
] }
http-body-util = "0.1"
proptest = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.50.0", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "signal",
  "time",
] }
tower = { version = "0.5.3", features = ["util"] }

[package.metadata.id_effect]
# ADR 0010 crate tier - checked by scripts/tier-conformance.sh
tier = "example"
