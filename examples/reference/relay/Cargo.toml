[package]
name = "relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "id_effect reference app: a 3-node chat with presence over two-way RPC, channels and the mesh, built through id_effect_kit"
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"

[lib]
path = "src/lib.rs"

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
# Every id_effect battery comes through the kit, one feature each: RPC (`rpc`, every kind over
# WebSocket `rpc-ws`, HTTP/3 `http3`, WebTransport `webtransport`), the mesh with channels and
# mesh RPC (`cluster`, QUIC with mutual TLS `mesh-mtls`), room history on an event log
# (`events`) in PostgreSQL (`sql-pg`), bearer JWTs (`auth`) and principals (`authz`).
id_effect_kit = { path = "../../../crates/id_effect_kit", version = "0.12.0", features = [
  "web",
  "rpc",
  "rpc-ws",
  "http3",
  "webtransport",
  "cluster",
  "mesh-mtls",
  "events",
  "sql-pg",
  "auth",
  "authz",
] }
# The derive and `effect!` macros expand to `::id_effect::` paths, `#[rpc::service]` to
# `::id_effect_rpc::` paths: keep both crates (the kit picks their features).
id_effect = { path = "../../../crates/id_effect", version = "0.12.0" }
id_effect_rpc = { path = "../../../crates/id_effect_rpc", version = "0.12.0" }
# `ProcessNode` and `NodeName`: the local process layer the mesh distributes (the kit does not
# re-export it; the cluster template names it the same way).
id_effect_process = { path = "../../../crates/id_effect_process", version = "0.12.0" }
axum = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "sync",
  "time",
  "signal",
] }

[dev-dependencies]
# Containers (PostgreSQL in its own container) for the tests.
id_effect_kit = { path = "../../../crates/id_effect_kit", version = "0.12.0", features = [
  "test",
] }
# tests/contract.rs: `id-effect rpc check` in process. Path-only.
id_effect_tool = { path = "../../../crates/id_effect_tool" }
# tests/browser.rs (D12): Chromium over CDP, the driver id_effect_rpc's browser test uses.
headless_chrome = "=1.0.22"
# tests/common: the Rust client's `wss://` socket (`WsClient::over` a TLS stream) carrying an
# Authorization header; the versions already in the tree.
tokio-rustls = { version = "=0.26.6", default-features = false, features = [
  "logging",
  "tls12",
] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = [
  "handshake",
] }
# tests/contract.rs runs `deno test` beside the nodes and reads its output.
tokio = { version = "1", features = ["io-util", "process"] }

[package.metadata.id_effect]
# ADR 0010 crate tier (Amendment 8) — checked by scripts/tier-conformance.sh. The Relay is the
# CI-tested consumer that moves id_effect_rpc to tier `platform` (check P).
tier = "example"
