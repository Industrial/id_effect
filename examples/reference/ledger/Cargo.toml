[package]
name = "ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "id_effect reference app: a multi-tenant double-entry ledger built through id_effect_kit"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Configuration loading returns `Result<_, ConfigError>` like id_effect_config.
result_large_err = "allow"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ledger"
path = "src/main.rs"

[dependencies]
# Every id_effect battery comes through the kit, one feature each.
id_effect_kit = { path = "../../../crates/id_effect_kit", version = "0.12.0", features = [
  "web",
  "openapi",
  "sql-pg",
  "migrate",
  "repository",
  "audit",
  "auth",
  "auth-oidc",
  "auth-totp",
  "authz",
  "redis",
  "config-vault",
  "jobs",
  "jobs-cron",
  # Account closure as a durable workflow (`src/closure.rs`).
  "workflow",
  "messaging",
  "redis-streams",
  "mail",
  "console",
  "storage",
  "storage-s3",
  "auth-accounts",
  "otel",
  "http-client",
  "logger",
  # The accounts and journal over RPC under `/rpc` (`src/rpc.rs`, ADR 0014).
  "rpc",
] }
# `#[rpc::service]` expands to `::id_effect_rpc::` paths: the RPC crate is named too (the kit's
# `rpc` feature picks its features).
id_effect_rpc = { path = "../../../crates/id_effect_rpc", version = "0.12.0", default-features = false }
# The `Schema` derive expands to `::id_effect::` paths, so the core crate is named too (the kit
# README's advice).
id_effect = { path = "../../../crates/id_effect", version = "0.12.0" }
axum = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "time",
] }
# Bearer-only requests are routed past the CSRF check (`app::security`).
tower = { version = "0.5", default-features = false, features = ["util"] }

[dev-dependencies]
# Containers, isolated databases, fixtures and the in-process HTTP client.
id_effect_kit = { path = "../../../crates/id_effect_kit", version = "0.12.0", features = [
  "test",
] }
# tests/oidc.rs plays the browser against Keycloak; tests/config.rs writes Vault secrets;
# tests/mail.rs reads Mailpit's API; tests/statements.rs creates the S3 bucket.
reqwest = { version = "0.13", default-features = false }
# tests/observability.rs: the SendGrid API, mocked.
wiremock = "0.6"
# tests/statements.rs: the statements bucket is created with object_store's SigV4 signer (the
# Ledger itself never creates buckets; id_effect_storage has no such call).
object_store = { version = "0.14", default-features = false, features = [
  "aws",
] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "time",
] }

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh. The reference app is the
# CI-tested consumer that puts the 0.9 and 0.10 battery crates, and id_effect_workflow (0.11),
# in tier `platform` (check P).
tier = "example"
