# Local development against `compose.yaml` (plain HTTP, so the session cookie is not `Secure`).

[db]
password = "ledger-dev"
# With a streaming replica running: replicas = ["postgres://ledger:ledger-dev@localhost:5433/ledger"]

[redis]
url = "redis://localhost:6379/0"

[auth]
jwt_secret = "dev-only: replace with 32+ random bytes in prod"
cookie_key = "ZGV2ZGV2ZGV2ZGV2ZGV2ZGV2ZGV2ZGV2ZGV2ZGV2ZGV2ZGV2ZGV2ZGV2ZGV2ZGV2ZGV2ZGV2ZGV2ZGV2ZGV2ZGV2"
session_cookie = "id_session"
secure_cookies = false

[mail]
# Mailpit from `compose.yaml` (web UI on http://localhost:8025).
transport = "smtp"
smtp_host = "localhost"
smtp_port = 1025
previews = true

[storage]
# SeaweedFS from `compose.yaml` (`s3.json` holds the credentials).
bucket = "ledger-statements"
endpoint = "http://localhost:8333"
access_key_id = "ledger"
secret_access_key = "ledger-dev-secret"
allow_http = true

[console]
# The operator console at http://localhost:8080/_console (dev only; `base.toml` turns it off).
enabled = true

[oidc]
issuer = "http://localhost:8180/realms/ledger"
client_id = "ledger-web"
client_secret = "ledger-web-secret"
redirect_url = "http://localhost:8080/auth/oidc/callback"
