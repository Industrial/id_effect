# Production. No secret lives in this file: the database password and the JWT signing secret
# are read from Vault (KV v2) when the service starts, with the token in `VAULT_TOKEN`.

[http]
host = "0.0.0.0"

[db]
host = "postgres"

[redis]
url = "redis://redis:6379/0"

[auth]
session_cookie = "__Host-id_session"
secure_cookies = true

[mail]
# The SendGrid v3 API over the traced HTTP client; the API key comes from Vault (`ledger/mail`).
transport = "sendgrid"
verify_url = "https://ledger.example/verify"
reset_url = "https://ledger.example/reset"

[storage]
# AWS S3 with the instance's credentials.
bucket = "ledger-statements"
region = "eu-central-1"

[vault]
addr = "http://vault:8200"
mount = "secret"

# Vault secret path -> where its keys land: `ledger/db`'s `password` becomes `db.password`.
[vault.secrets]
db = "ledger/db"
auth = "ledger/auth"
mail = "ledger/mail"
