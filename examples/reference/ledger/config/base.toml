# Settings shared by every profile. `config/<profile>.toml` overrides them, then (in `prod`)
# the Vault secrets, then `LEDGER_*` environment variables (`LEDGER_DB__HOST=db`).

[http]
host = "127.0.0.1"
port = 8080
# A request still running after this long is answered 503 and its fiber interrupted.
request_timeout_ms = 10000
# Larger request bodies are answered 413.
body_limit_bytes = 65536
# The reverse proxies in front of the service (CIDRs, e.g. ["10.0.0.0/8"]): the login limit
# counts against the client they report in X-Forwarded-For. Empty: the connection's peer.
trusted_proxies = []

[db]
host = "localhost"
port = 5432
user = "ledger"
name = "ledger"
# Applied at start (`id-effect migrate run` applies the same directory).
migrations = "migrations"
# Read replicas (PostgreSQL URLs); reports and balances read from them.
replicas = []
max_connections = 10

[auth]
jwt_issuer = "ledger"
jwt_audience = "ledger-api"
# API tokens live this long.
token_ttl_minutes = 60
# Login attempts: a bucket of `login_burst` refilled at `login_per_second`.
login_per_second = 0.2
login_burst = 5
# And per organisation (the `X-Ledger-Org` a login names), all its clients together.
login_tenant_per_second = 2.0
login_tenant_burst = 50
# Failed logins of an account or a client before each further one waits (1 s, doubling).
login_free_attempts = 5
# The login limits above are re-read from this file and the profile's every N seconds (0: never).
reload_limits_secs = 10
# Argon2id memory cost in KiB (OWASP: 19456).
password_memory_kib = 19456
totp_issuer = "Ledger"

[mail]
# `memory` (kept, never sent), `smtp` or `sendgrid`.
transport = "memory"
from = "statements@ledger.example"
from_name = "Ledger"
# `<name>.subject.txt`, `<name>.txt` and `<name>.html` per mail.
templates = "templates/mail"
verify_url = "http://localhost:8080/verify"
reset_url = "http://localhost:8080/reset"

[storage]
# The statements bucket; without one they are kept in memory.
region = "us-east-1"

[statements]
# 06:00 UTC on the first of every month: the previous month's statements.
cron = "0 0 6 1 * *"
# A statement up to 1 MiB is attached to its mail; a larger one is a signed link.
attach_max_bytes = 1048576
link_ttl_hours = 168

[jobs]
# The worker, the statement cron (one instance at a time), the outbox relay and the consumers.
run = true
concurrency = 4

[messaging]
topic = "ledger.entry-posted"
group = "balance-notifications"
max_deliveries = 5
consumer = "ledger-1"

[console]
# `/_console` (behind `console.admin`) is mounted in `dev` (`dev.toml`) and the tests' `test`
# profile only: an operator surface stays closed in prod (ADR 0013 R7).
enabled = false
