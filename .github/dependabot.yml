version: 2
updates:
  # Keep GitHub Actions up to date. Every `uses:` is pinned by full commit SHA with a `# vX.Y.Z`
  # comment (0.11.0.md S1, scripts/check-workflows.sh); Dependabot bumps the SHA and the comment
  # together. `directory: /` covers .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: auto
    # One PR for the patch and minor action bumps; majors stay separate (dependabot-auto-merge.yml
    # leaves those to a person).
    groups:
      github-actions:
        update-types:
          - patch
          - minor
  # Keep Cargo dependencies up to date
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: auto
    ignore:
      # sysinfo >= 0.34 requires a newer rustc than workspace rust-version (see 0b47791).
      # Lift together with an intentional MSRV bump.
      - dependency-name: sysinfo
        versions: [">=0.34"]
    # Group all patch and minor Cargo updates into a single PR
    groups:
      patch-updates:
        update-types:
          - patch
      minor-updates:
        update-types:
          - minor
