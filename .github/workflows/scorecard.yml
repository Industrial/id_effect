# OpenSSF Scorecard (0.11.0.md E11.3; docs/security/openssf.md): weekly and on every push to main,
# with the results published to the Scorecard API (the README badge reads them) and uploaded to code
# scanning. The scorecard action verifies this workflow before publishing: no top-level env or
# defaults, no containers or services, and only the steps below.
name: Scorecard
on:
  push:
    branches: [main]
  schedule:
    # Every Monday at 04:30 UTC
    - cron: "30 4 * * 1"
  # Re-score when the branch protection settings change (Branch-Protection check).
  branch_protection_rule:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Read the workflow runs (CI-Tests, SAST and Packaging checks).
      actions: read
      # Upload the SARIF results to code scanning.
      security-events: write
      # Sign the published results with the OIDC token (publish_results: true).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Keep the SARIF as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
