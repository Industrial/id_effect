# ClusterFuzzLite PR fuzzing (0.11.0.md D20; docs/security/fuzzing.md): builds the cargo-fuzz
# targets in fuzz/ and fuzzes the ones the change affects, starting from the corpus the nightly
# batch (cflite_batch.yml) stores. A new crash fails the job and is reported with its input.
name: ClusterFuzzLite PR fuzzing
on:
  pull_request:
    paths:
      - "crates/**"
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - "Cargo.lock"
      - ".github/workflows/cflite_pr.yml"
permissions:
  contents: read
jobs:
  PR:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      # Download the corpus the batch job stored as workflow artifacts.
      actions: read
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.sanitizer }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - address
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Split evenly across the targets: 5 minutes each for the 17 in fuzz/ (D20; 0.12 added the
          # six rpc and SSE decoders). Add 300 per target added to fuzz/Cargo.toml.
          fuzz-seconds: 5100
          mode: code-change
          sanitizer: ${{ matrix.sanitizer }}
