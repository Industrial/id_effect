name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NEXTEST_NO_TESTS: pass
  MOON_TOOLCHAIN_FORCE_GLOBALS: rust
jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Moon pipeline: PRs = --affected + graph relations; main = full workspace
  # (treefmt stack required because every crate :check depends on effect:ci-format)
  # ──────────────────────────────────────────────────────────────────────────
  moon-ci:
    name: Moon CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version drift (examples/templates pin the workspace version)
        run: bash scripts/check-version-drift.sh
      - name: Scorecard (validate, METHOD §5.2 self-test, committed results, reports and page stable)
        run: |
          set -euo pipefail
          bash scripts/scorecard.sh --validate --self-test
          for v in 0.6.0 0.7.0 0.8.0; do
            bash scripts/scorecard.sh --json "$v" | diff - "docs/scorecard/results/v$v.json"
          done
          bash scripts/scorecard.sh --diff 0.7.0 0.8.0 --compare-targets 0.8.0
          bash scripts/scorecard.sh --method 1 --version 0.7.0
          bash scripts/scorecard.sh --report 0.7.0 --report 0.8.0 --html --method-compare
          git diff --exit-code docs/scorecard/REPORT-0.7.0.md docs/scorecard/REPORT-0.8.0.md docs/scorecard/index.html docs/scorecard/REPORT-method-v2.md
      - name: Install Nix (formatters for treefmt)
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Install treefmt toolchain (nixpkgs)
        run: |
          nix profile install \
            nixpkgs#treefmt \
            nixpkgs#alejandra \
            nixpkgs#taplo \
            nixpkgs#deadnix \
            nixpkgs#actionlint \
            nixpkgs#beautysh \
            nixpkgs#yamlfmt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Biome (treefmt formatter for JS/JSON)
        run: npm install -g @biomejs/biome
      # Pinned (not @stable): the trybuild suite (`crates/id_effect/tests/ui`) snapshots rustc
      # diagnostics, which change between releases. Re-bless it when bumping (see its docs).
      - name: Install Rust (1.99.0)
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.87.27
        with:
          tool: cargo-nextest
      - name: Install moon
        run: |
          curl -fsSL https://moonrepo.dev/install/moon.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Fetch base ref (for affected diffs)
        run: git fetch origin "${{ github.base_ref || 'main' }}"
      - name: moon sync
        run: moon sync
      - name: Moon run (affected on PR, full on main)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CI_BASE="origin/${{ github.base_ref }}" bash scripts/ci-local.sh affected
          else
            bash scripts/ci-local.sh full
          fi
  # ──────────────────────────────────────────────────────────────────────────
  # Workspace coverage (llvm-cov cannot be expressed per-crate easily; run full)
  # ──────────────────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [moon-ci]
    steps:
      - uses: actions/checkout@v7
      - name: Install system deps (OpenSSL for rdkafka)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Install Rust (1.99.0, same pin as moon-ci)
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: llvm-tools-preview
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2.87.27
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Generate coverage (lcov)
        run: bash scripts/llvm-cov-nextest.sh --workspace --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
  # ──────────────────────────────────────────────────────────────────────────
  # Cross-platform smoke: full workspace tests (not Moon-affected; OS/toolchain)
  # ──────────────────────────────────────────────────────────────────────────
  matrix:
    name: ${{ matrix.toolchain }} / ${{ matrix.os }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    needs: [moon-ci]
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}-${{ matrix.os }}
      - name: cargo test (workspace)
        run: cargo test --workspace --all-features
  # ──────────────────────────────────────────────────────────────────────────
  # MSRV: build the workspace on [workspace.package] rust-version (single source)
  # ──────────────────────────────────────────────────────────────────────────
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    needs: [moon-ci]
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Install Rust (${{ steps.msrv.outputs.version }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: cargo check (workspace, MSRV)
        # No committed Cargo.lock (library workspace): resolve with the MSRV-aware
        # resolver so dependencies compatible with rust-version are selected.
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: cargo check --workspace --all-targets
  # ──────────────────────────────────────────────────────────────────────────
  # Postgres integration: live tests for id_effect_sql `pg` and id_effect_node `pg`.
  # ID_EFFECT_REQUIRE_PG=1 turns a missing/unreachable database into a failure
  # (locally those tests print SKIP instead of silently passing).
  # ──────────────────────────────────────────────────────────────────────────
  pg-integration:
    name: Postgres integration
    runs-on: ubuntu-latest
    needs: [moon-ci]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      ID_EFFECT_REQUIRE_PG: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: pg
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.87.27
        with:
          tool: cargo-nextest
      - name: Live Postgres tests
        run: >-
          cargo nextest run -p id_effect_sql -p id_effect_node -p http_showcase -p id_effect_auth -p id_effect_authz -p id_effect_test -p id_effect_tool --features id_effect_sql/pg,id_effect_sql/migrate,id_effect_sql/query,id_effect_sql/repository,id_effect_sql/audit,id_effect_node/pg,id_effect_auth/pg
  # ──────────────────────────────────────────────────────────────────────────
  # Container integration: tests that start real services with testcontainers
  # (id_effect_test containers, the Keycloak OIDC login, the Vault provider, Redis).
  # ID_EFFECT_REQUIRE_DOCKER=1 turns a missing Docker daemon into a failure
  # (locally those tests print SKIP instead of silently passing).
  # ──────────────────────────────────────────────────────────────────────────
  containers-integration:
    name: Container integration
    runs-on: ubuntu-latest
    needs: [moon-ci]
    env:
      ID_EFFECT_REQUIRE_DOCKER: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: containers
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.87.27
        with:
          tool: cargo-nextest
      - name: Container tests
        run: cargo nextest run -p id_effect_test -p id_effect_auth -p id_effect_config -p id_effect_sql -p id_effect_redis --all-features
  # ──────────────────────────────────────────────────────────────────────────
  # Reference app: examples/reference/ledger, the CI-tested consumer that puts the
  # 0.9 batteries in tier `platform` (ADR 0012, tier-conformance check P). Its
  # migrations go through `id-effect migrate run` / `check` against a service
  # database; its tests start PostgreSQL, Redis, Vault and Keycloak containers.
  # ──────────────────────────────────────────────────────────────────────────
  reference-ledger:
    name: Reference app (Ledger)
    runs-on: ubuntu-latest
    needs: [moon-ci]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ledger" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ID_EFFECT_REQUIRE_DOCKER: '1'
      DATABASE_URL: postgres://ledger:ledger@localhost:5432/ledger
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: reference-ledger
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.87.27
        with:
          tool: cargo-nextest
      - name: Format and lints
        run: |
          cargo fmt -p ledger --check
          cargo clippy -p ledger --all-targets -- -D warnings
      - name: Migrations (id-effect migrate run, then check)
        working-directory: examples/reference/ledger
        run: |
          cargo run -q -p id_effect_tool --bin id-effect -- migrate run
          cargo run -q -p id_effect_tool --bin id-effect -- migrate check
          cargo run -q -p id_effect_tool --bin id-effect -- migrate status
      - name: Ledger tests (CRUD, sessions, JWT, OIDC + PKCE, RBAC denials, Vault, Redis, replica)
        run: cargo nextest run -p ledger
  # ──────────────────────────────────────────────────────────────────────────
  # Labs: unpublished crates in the separate labs/ workspace (ADR 0010 Amendment 1).
  # No API guarantees, but they must keep building and passing against core.
  # ──────────────────────────────────────────────────────────────────────────
  labs:
    name: Labs (unpublished)
    runs-on: ubuntu-latest
    needs: [moon-ci]
    steps:
      - uses: actions/checkout@v7
      - name: Install system deps (OpenSSL for rdkafka)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config cmake
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: labs
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.87.27
        with:
          tool: cargo-nextest
      - name: Test labs workspace
        run: cargo nextest run --manifest-path labs/Cargo.toml --workspace --all-features
  # ──────────────────────────────────────────────────────────────────────────
  # Minimal-versions lock resolution (workspace-wide)
  # ──────────────────────────────────────────────────────────────────────────
  minimal-versions:
    name: Minimal Versions
    runs-on: ubuntu-latest
    needs: [moon-ci]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (nightly for -Z minimal-versions)
        uses: dtolnay/rust-toolchain@nightly
      - name: Install Rust (stable for build)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Generate minimal versions lock
        run: |
          cargo +nightly update -Z minimal-versions
          # minimal-versions resolves crc32fast 1.1.x whose build.rs needs modern semver
          cargo update -p crc32fast@1.1.0 --precise 1.4.2
          cargo update -p semver@1.0.0 --precise 1.0.20
          cargo update -p async-trait --precise 0.1.89
          # (openssl/openssl-sys/metrics pins removed in 0.6: those crates now only appear in the
          # unpublished labs/ workspace, which this job does not build.)
      - name: cargo check (minimal versions, stable)
        run: cargo +stable check --workspace --all-features
  # ──────────────────────────────────────────────────────────────────────────
  # crates.io packaging / publish-order (same script as publish.yml)
  # Catches path+version chicken-and-egg before a tag publish fails mid-wave.
  # ──────────────────────────────────────────────────────────────────────────
  validate-packaging:
    name: Validate crate packaging
    runs-on: ubuntu-latest
    needs: [moon-ci]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Validate crate packaging
        run: bash scripts/validate-crate-packaging.sh
  # ──────────────────────────────────────────────────────────────────────────
  # `id-effect new` templates: each one generated outside the repo against this
  # checkout (--local-workspace), then fmt / build / clippy / test; the service
  # is also built as a Docker image and probed on /health.
  # ──────────────────────────────────────────────────────────────────────────
  templates:
    name: Template ${{ matrix.template }}
    runs-on: ubuntu-latest
    needs: [moon-ci]
    strategy:
      fail-fast: false
      matrix:
        template: [service, worker, cli, cluster]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: templates-${{ matrix.template }}
      - name: Generate, build and test the template
        env:
          TEMPLATE: ${{ matrix.template }}
          SMOKE_DIR: ${{ runner.temp }}/template-smoke
          # Inside ./target so the cache step keeps the generated projects' dependencies.
          SMOKE_TARGET_DIR: ${{ github.workspace }}/target/template-smoke
        run: |
          args=("$TEMPLATE")
          if [ "$TEMPLATE" = service ]; then args+=(--docker); fi
          bash scripts/template-smoke.sh "${args[@]}"
  # ──────────────────────────────────────────────────────────────────────────
  # Supply-chain policy: advisories, licenses, bans, sources (deny.toml).
  # No committed Cargo.lock, so this checks a fresh resolution.
  # ──────────────────────────────────────────────────────────────────────────
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.87.27
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check
  # ──────────────────────────────────────────────────────────────────────────
  # Semver: published crates vs the crates.io baseline (docs/STABILITY.md).
  # REPORT-ONLY while a breaking 0.x release is in development: 0.9 carries intentional
  # breaks (release spec D2), each of which must be listed in docs/MIGRATION-0.9.md; the
  # job prints them for review (PLAN-OF-PLANS §7.3 semver gate) but cannot fail CI.
  # Baseline = the latest published release (0.8.0).
  # ──────────────────────────────────────────────────────────────────────────
  semver:
    name: Semver checks (report-only, baseline 0.8.0)
    runs-on: ubuntu-latest
    needs: [moon-ci]
    env:
      SEMVER_BASELINE: 0.8.0
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: semver
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2.87.27
        with:
          tool: cargo-semver-checks
      - name: cargo semver-checks (publishable workspace crates)
        # --workspace skips publish = false members (examples). Step-level
        # continue-on-error keeps the job (and ci-pass) green while report-only.
        # id_effect_auth, id_effect_authz, id_effect_test and id_effect_redis (new in 0.9) have no
        # crates.io baseline yet; drop each exclude once that crate is published.
        continue-on-error: true
        run: >-
          cargo semver-checks --workspace --baseline-version "$SEMVER_BASELINE" --exclude id_effect_auth --exclude id_effect_authz --exclude id_effect_test --exclude id_effect_redis
  # ──────────────────────────────────────────────────────────────────────────
  # Required status check gate
  # ──────────────────────────────────────────────────────────────────────────
  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    needs:
      - moon-ci
      - coverage
      - matrix
      - msrv
      - pg-integration
      - containers-integration
      - reference-ledger
      - labs
      - minimal-versions
      - validate-packaging
      - templates
      - deny
      - semver
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(echo "$results" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key
          ')
          if [ -n "$failed" ]; then
            echo "Failed jobs: $failed"
            exit 1
          fi
          echo "All required jobs passed"
