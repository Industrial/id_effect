name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NEXTEST_NO_TESTS: pass
  MOON_TOOLCHAIN_FORCE_GLOBALS: rust
  # The pinned toolchain: keep equal to rust-toolchain.toml's `channel` (S1). Pinned (not stable):
  # the trybuild suites (`crates/id_effect/tests/ui`, tests/security_compile_fail) snapshot rustc
  # diagnostics, which change between releases. Re-bless them when bumping (see their docs).
  RUST_TOOLCHAIN: 1.99.0
  # Pinned moon release, downloaded and checked against its sha256 (no `curl | bash`, S1).
  MOON_VERSION: 2.6.2
  MOON_SHA256: 103590c2a9e0894ec09ddce8462e4aa4b3d47debdf28a7d8ae8ccb60f84f3a08
# Least privilege (S2): every job reads the repository only; no job needs a write grant.
permissions:
  contents: read
jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Moon pipeline: PRs = --affected + graph relations; main = full workspace
  # (treefmt stack required because every crate :check depends on effect:ci-format)
  # ──────────────────────────────────────────────────────────────────────────
  moon-ci:
    name: Moon CI
    runs-on: ubuntu-latest
    env:
      # Line tables keep backtraces and shrink target/ several-fold; full debuginfo filled the
      # runner's disk at 0.11 ("No space left on device", ld bus error).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Free runner disk (preinstalled SDKs the build never uses)
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Version drift (examples/templates pin the workspace version)
        run: bash scripts/check-version-drift.sh
      - name: Workflow policy (SHA-pinned actions, least privilege, no piped installers; S1 S2)
        run: bash scripts/check-workflows.sh --self-test && bash scripts/check-workflows.sh
      - name: Scorecard (validate, METHOD §5.2 self-test, committed results, reports and page stable)
        run: |
          set -euo pipefail
          bash scripts/scorecard.sh --validate --self-test
          for v in 0.6.0 0.7.0 0.8.0 0.9.0 0.10.0 0.11.0 0.12.0; do
            bash scripts/scorecard.sh --json "$v" | diff - "docs/scorecard/results/v$v.json"
          done
          bash scripts/scorecard.sh --diff 0.9.0 0.10.0 --compare-targets 0.10.0
          bash scripts/scorecard.sh --diff 0.10.0 0.11.0 --compare-targets 0.11.0
          bash scripts/scorecard.sh --diff 0.11.0 0.12.0 --compare-targets 0.12.0
          bash scripts/scorecard.sh --method 1 --version 0.7.0
          # No --report 0.11.0 / 0.12.0: those reports end with hand-written release exit notes the
          # generator cannot produce, so regenerating them would always differ.
          bash scripts/scorecard.sh --report 0.7.0 --report 0.8.0 --report 0.9.0 --report 0.10.0 --html --method-compare
          git diff --exit-code docs/scorecard/REPORT-0.7.0.md docs/scorecard/REPORT-0.8.0.md docs/scorecard/REPORT-0.9.0.md docs/scorecard/REPORT-0.10.0.md docs/scorecard/index.html docs/scorecard/REPORT-method-v2.md
      - name: Install Nix (formatters for treefmt)
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Install treefmt toolchain (nixpkgs)
        run: |
          nix profile install \
            nixpkgs#treefmt \
            nixpkgs#alejandra \
            nixpkgs#taplo \
            nixpkgs#deadnix \
            nixpkgs#actionlint \
            nixpkgs#beautysh \
            nixpkgs#yamlfmt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install Biome (treefmt formatter for JS/JSON)
        run: npm install -g @biomejs/biome
      - name: Install Rust (pinned, rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest
      - name: Install moon (pinned release, sha256-checked)
        run: |
          set -euo pipefail
          archive=moon_cli-x86_64-unknown-linux-gnu.tar.xz
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/moonrepo/moon/releases/download/v${MOON_VERSION}/$archive"
          echo "${MOON_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$HOME/.moon/bin"
          tar -xJf "$RUNNER_TEMP/$archive" -C "$HOME/.moon/bin" --strip-components=1 moon_cli-x86_64-unknown-linux-gnu/moon moon_cli-x86_64-unknown-linux-gnu/moonx
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Fetch base ref (for affected diffs)
        run: git fetch origin "${{ github.base_ref || 'main' }}"
      - name: moon sync
        run: moon sync
      - name: Moon run (affected on PR, full on main)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CI_BASE="origin/${{ github.base_ref }}" bash scripts/ci-local.sh affected
          else
            bash scripts/ci-local.sh full
          fi
  # ──────────────────────────────────────────────────────────────────────────
  # Workspace coverage (llvm-cov cannot be expressed per-crate easily; run full)
  # ──────────────────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [moon-ci]
    env:
      # Coverage reads the __llvm_covmap sections, not DWARF; without debuginfo the instrumented
      # test and example binaries fit the runner (at 0.12 they filled 111 GB free).
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Free runner disk (preinstalled SDKs the build never uses)
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system deps (OpenSSL for rdkafka)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Install Rust (pinned, rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Generate coverage (lcov)
        run: bash scripts/llvm-cov-nextest.sh --workspace --locked --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
  # ──────────────────────────────────────────────────────────────────────────
  # Cross-platform smoke: full workspace tests (not Moon-affected; OS/toolchain)
  # ──────────────────────────────────────────────────────────────────────────
  matrix:
    name: ${{ matrix.toolchain }} / ${{ matrix.os }}
    # main pushes, and a manual dispatch to check a branch before it reaches main.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    needs: [moon-ci]
    env:
      # Full debuginfo for every --all-features test binary filled the ubuntu runner at 0.12.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Free runner disk (preinstalled SDKs the build never uses)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.toolchain }}-${{ matrix.os }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest
      # nextest runs each test in its own process, as every other job does: under plain
      # `cargo test` tests share process-wide state (tracing callsite interest, the umask, env).
      # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml: this job tests the matrix toolchain.
      - name: cargo nextest (workspace)
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo nextest run --workspace --all-features --locked
      - name: cargo test --doc (workspace)
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo test --workspace --all-features --locked --doc
  # ──────────────────────────────────────────────────────────────────────────
  # MSRV: build the workspace on [workspace.package] rust-version (single source)
  # ──────────────────────────────────────────────────────────────────────────
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    needs: [moon-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Install Rust (${{ steps.msrv.outputs.version }})
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv
      - name: cargo check (workspace, MSRV)
        # The committed Cargo.lock (S5, D12) must build on rust-version: --locked fails instead of
        # re-resolving. RUSTUP_TOOLCHAIN overrides rust-toolchain.toml.
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo check --workspace --all-targets --locked
  # ──────────────────────────────────────────────────────────────────────────
  # TypeScript client (D12): `id-effect rpc gen ts` against its golden output, `deno check` of
  # the generated client and its tests, `deno test` against the test service on loopback
  # (tests/rpc_gen_ts.rs). Deno is pinned here and in devenv.nix; no npm, no node_modules.
  # ID_EFFECT_REQUIRE_DENO=1 turns a missing Deno into a failure (locally the tests print SKIP).
  # ──────────────────────────────────────────────────────────────────────────
  ts-client:
    name: TypeScript client (Deno)
    runs-on: ubuntu-latest
    needs: [moon-ci]
    env:
      ID_EFFECT_REQUIRE_DENO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Deno (pinned)
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.7.9
      - name: Install Rust (pinned, rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ts-client
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest
      - name: Golden output, deno check, deno test against the test server
        run: cargo nextest run --locked -p id_effect_tool --test rpc_gen_ts
      - name: deno check and deno test of the checked-in client (server tests ignored)
        working-directory: crates/id_effect_tool
        run: |
          deno check --no-config --no-remote tests/golden/rpc/*/*.ts tests/ts/*.ts
          deno test --no-config --no-remote --no-prompt tests/ts/
  # ──────────────────────────────────────────────────────────────────────────
  # Postgres integration: every live test that reads DATABASE_URL (id_effect_sql `pg`,
  # id_effect_node `pg`, id_effect_auth `pg` / `accounts`, id_effect_jobs (+ `cron`),
  # id_effect_messaging, id_effect_events `pg`, id_effect_mail `jobs`, id_effect_tool migrate,
  # http_showcase). Tests sharing the one database use a schema or database of their own.
  # ID_EFFECT_REQUIRE_PG=1 turns a missing/unreachable database into a failure
  # (locally those tests print SKIP instead of silently passing).
  # ──────────────────────────────────────────────────────────────────────────
  pg-integration:
    name: Postgres integration
    runs-on: ubuntu-latest
    needs: [moon-ci]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      ID_EFFECT_REQUIRE_PG: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (pinned, rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: pg
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest
      - name: Live Postgres tests
        run: >-
          cargo nextest run --locked -p id_effect_sql -p id_effect_node -p http_showcase -p id_effect_auth -p id_effect_authz -p id_effect_test -p id_effect_tool -p id_effect_jobs -p id_effect_messaging -p id_effect_events -p id_effect_mail -p id_effect_workflow --features id_effect_sql/pg,id_effect_sql/migrate,id_effect_sql/query,id_effect_sql/repository,id_effect_sql/audit,id_effect_node/pg,id_effect_auth/pg,id_effect_auth/accounts,id_effect_jobs/cron,id_effect_events/pg,id_effect_mail/jobs
  # ──────────────────────────────────────────────────────────────────────────
  # Container integration: tests that start real services with testcontainers
  # (id_effect_test containers, the Keycloak OIDC login, the Vault provider, Redis).
  # ID_EFFECT_REQUIRE_DOCKER=1 turns a missing Docker daemon into a failure
  # (locally those tests print SKIP instead of silently passing).
  # ──────────────────────────────────────────────────────────────────────────
  containers-integration:
    name: Container integration
    runs-on: ubuntu-latest
    needs: [moon-ci]
    env:
      ID_EFFECT_REQUIRE_DOCKER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (pinned, rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: containers
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest
      - name: Container tests
        run: cargo nextest run --locked -p id_effect_test -p id_effect_auth -p id_effect_config -p id_effect_sql -p id_effect_redis -p id_effect_mail -p id_effect_storage --all-features
  # ──────────────────────────────────────────────────────────────────────────
  # Reference app: examples/reference/ledger, the CI-tested consumer that puts the
  # 0.9 batteries and id_effect_workflow in tier `platform` (ADR 0012, tier-conformance
  # check P). Its migrations go through `id-effect migrate run` / `check` against a
  # service database; its tests start PostgreSQL, Redis, Vault, Keycloak, Mailpit and
  # S3 containers. The Ledger KPI (0.11): the prod posture check passes with zero
  # accepted risks, every route is public or guarded, and account closure runs as a
  # durable workflow.
  # ──────────────────────────────────────────────────────────────────────────
  reference-ledger:
    name: Reference app (Ledger)
    runs-on: ubuntu-latest
    needs: [moon-ci]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ledger" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ID_EFFECT_REQUIRE_DOCKER: '1'
      ID_EFFECT_REQUIRE_PG: '1'
      # tests/rpc.rs runs the generated TypeScript client under Deno: fail without it.
      ID_EFFECT_REQUIRE_DENO: '1'
      DATABASE_URL: postgres://ledger:ledger@localhost:5432/ledger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags and the RPC contract they shipped (`id-effect rpc check`).
          fetch-depth: 0
      - name: Install Rust (pinned, rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Install Deno (pinned)
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.7.9
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: reference-ledger
      # The tests start their own containers (id_effect_test, testcontainers): pull the 0.10
      # services' pinned images up front so no test times out on a cold pull. Mailpit (mail),
      # Redis (cache, rate limits, Redis Streams) and SeaweedFS (the statements bucket); the
      # tags are id_effect_test's MAILPIT_TAG and S3_TAG.
      - name: Pull the service images (Mailpit, Redis, S3)
        run: |
          docker pull -q axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
          docker pull -q redis:7-alpine
          docker pull -q chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest
      - name: Format and lints
        run: |
          cargo fmt -p ledger --check
          cargo clippy -p ledger --all-targets --locked -- -D warnings
      - name: Migrations (id-effect migrate run, then check)
        working-directory: examples/reference/ledger
        run: |
          cargo run -q --locked -p id_effect_tool --bin id-effect -- migrate run
          cargo run -q --locked -p id_effect_tool --bin id-effect -- migrate check
          cargo run -q --locked -p id_effect_tool --bin id-effect -- migrate status
      # `cargo nextest` keeps rpc.contract.json equal to the served contract (UPDATE_GOLDEN=1
      # rewrites it); this checks the checked-in TypeScript client (`web/rpc`) is generated from
      # it and compares it with the last release tag, failing on a breaking change. A tag from
      # before the Ledger's rpc.contract.json existed has nothing to compare with: skipped.
      - name: RPC contract (id-effect rpc check, generated client, last release)
        working-directory: examples/reference/ledger
        run: |
          set -euo pipefail
          id_effect() { cargo run -q --locked -p id_effect_tool --bin id-effect -- "$@"; }
          id_effect rpc check --contract rpc.contract.json --generated web/rpc
          path=examples/reference/ledger/rpc.contract.json
          tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "${tag}" ] || ! git cat-file -e "${tag}:${path}" 2>/dev/null; then
            echo "no released ${path} to compare with: skipped"
            exit 0
          fi
          id_effect rpc check --contract rpc.contract.json --against "${tag}:${path}"
      - name: Ledger KPI (prod posture, declared routes and procedures, RPC beside REST, console off in prod, durable account closure)
        run: >-
          cargo nextest run --locked -p ledger -E 'test(=ledger_prod_posture_is_clean) | test(=ledger_access_report_snapshot) | test(=h8_ledger_unregistered_route_denied) | test(=m6_ledger_console_disabled_in_prod_profile) | test(=account_closure_workflow_survives_restart) | test(=ledger_rpc_procedures_all_declared) | test(=ledger_rpc_and_rest_agree) | test(=ledger_rpc_mutation_idempotent) | test(=ledger_ts_client_round_trip)'
      - name: Ledger tests (CRUD, sessions, JWT, OIDC + PKCE, RBAC, Vault, Redis, replica, jobs, outbox, mail, S3, console, workflows)
        run: cargo nextest run --locked -p ledger
  # ──────────────────────────────────────────────────────────────────────────
  # RPC (0.12, ADR 0010 Amendment 8): id_effect_rpc (moved out of labs), id_effect_rpc_macros
  # and the Relay reference app, all features. They are not moon projects yet, so this job is
  # what runs their clippy and tests on every PR (the workspace jobs build them too).
  # ──────────────────────────────────────────────────────────────────────────
  rpc:
    name: RPC crates
    runs-on: ubuntu-latest
    needs: [moon-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (pinned, rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: rpc
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest
      - name: Clippy
        run: cargo clippy --locked -p id_effect_rpc -p id_effect_rpc_macros -p relay --all-targets --all-features -- -D warnings
      - name: Tests
        run: |
          cargo nextest run --locked -p id_effect_rpc -p id_effect_rpc_macros -p relay --all-features
          cargo test --locked -p id_effect_rpc -p id_effect_rpc_macros --doc --all-features
  # ──────────────────────────────────────────────────────────────────────────
  # Relay reference app (0.12 §6 KPI, never cut): three nodes on real QUIC and TLS on
  # loopback, the mesh (mutual TLS, `idm/1`) on the endpoint that serves HTTP/3 and
  # WebTransport (ADR 0014 D7), PostgreSQL in the tests' own container; the Rust client over
  # HTTP/1.1-2, HTTP/3 and WebSocket, the generated TypeScript client under Deno, Chromium over
  # CDP (WebTransport, then WebSocket); the prod posture with zero accepted risks; `id-effect rpc
  # check` against the last release tag; then once more with UDP dropped by iptables, to prove
  # the TCP fallback.
  # ──────────────────────────────────────────────────────────────────────────
  reference-relay:
    name: Reference app (Relay)
    runs-on: ubuntu-latest
    needs: [moon-ci]
    env:
      ID_EFFECT_REQUIRE_DOCKER: '1'
      ID_EFFECT_REQUIRE_BROWSER: '1'
      ID_EFFECT_REQUIRE_DENO: '1'
      # The UDP port the second run drops (`relay_udp_blocked_falls_back_to_tcp` binds it).
      RELAY_BLOCKED_PORT: '47443'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tags and the contract each shipped (`id-effect rpc check`).
          fetch-depth: 0
      - name: Install Rust (pinned, rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: reference-relay
      - name: Install Deno (pinned)
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.7.9
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest
      # The tests start PostgreSQL with id_effect_test (postgres:17-alpine): pull it up front so
      # no test times out on a cold pull. Chromium for the browser test is the runner's Chrome.
      - name: Pull PostgreSQL, check Chrome
        run: |
          docker pull -q postgres:17-alpine
          google-chrome --version
      - name: Format and lints
        run: |
          cargo fmt -p relay --check
          cargo clippy -p relay --all-targets --locked -- -D warnings
      - name: Relay KPI (3 nodes over HTTP/3 and WebSocket, presence, resume, membership, browser, TypeScript, prod posture, contract)
        run: cargo nextest run --locked -p relay
      - name: id-effect rpc check against the last release tag
        run: |
          tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          contract=examples/reference/relay/rpc.contract.json
          if [ -n "${tag}" ] && git cat-file -e "${tag}:${contract}" 2>/dev/null; then
            against="${tag}:${contract}"
          else
            # The Relay's contract is new in 0.12: until a tag ships it, compare it with itself
            # (the generated TypeScript client is still checked).
            echo "no released ${contract} at ${tag:-no tag}: checking the client only"
            against="${contract}"
          fi
          cargo run -q --locked -p id_effect_tool --bin id-effect -- rpc check \
            --contract "${contract}" --against "${against}" \
            --generated examples/reference/relay/web/src/rpc
      - name: UDP blocked (iptables drops UDP to the node), TCP fallback
        run: |
          sudo iptables -I INPUT -p udp --dport "${RELAY_BLOCKED_PORT}" -j DROP
          sudo ip6tables -I INPUT -p udp --dport "${RELAY_BLOCKED_PORT}" -j DROP
          RELAY_UDP_BLOCKED_PORT="${RELAY_BLOCKED_PORT}" \
            cargo nextest run --locked -p relay -E 'test(=relay_udp_blocked_falls_back_to_tcp)'
  # ──────────────────────────────────────────────────────────────────────────
  # Labs: unpublished crates in the separate labs/ workspace (ADR 0010 Amendment 1).
  # No API guarantees, but they must keep building and passing against core.
  # id_effect_rpc left labs in 0.12 (ADR 0010 Amendment 8); the `rpc` job above tests it.
  # No system packages: since 0.11 (bundled SQLite and duroxide left with the workflow crate) no
  # labs crate links OpenSSL, and aws-lc-sys (rustls via reqwest) builds without the cmake
  # binary on Linux, as in the main-workspace jobs.
  # ──────────────────────────────────────────────────────────────────────────
  labs:
    name: Labs (unpublished)
    runs-on: ubuntu-latest
    needs: [moon-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (pinned, rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: labs
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest
      - name: Test labs workspace
        run: cargo nextest run --manifest-path labs/Cargo.toml --workspace --all-features
  # ──────────────────────────────────────────────────────────────────────────
  # Minimal-versions lock resolution (workspace-wide)
  # ──────────────────────────────────────────────────────────────────────────
  minimal-versions:
    name: Minimal Versions
    runs-on: ubuntu-latest
    needs: [moon-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (nightly for -Z minimal-versions)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - name: Install Rust (pinned, rust-toolchain.toml, for the build)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Deliberately not --locked: this job replaces the committed Cargo.lock with the minimal one.
      - name: Generate minimal versions lock
        run: |
          cargo +nightly update -Z minimal-versions
          # Raise the floors minimal-versions picks too low. Each pin applies only while the graph
          # still resolves that package ID (`cargo update -p` errors on one the lockfile does not
          # hold, and 0.12's dependencies already raise crc32fast past 1.1.0):
          # - crc32fast 1.1.x: its build.rs needs modern semver (semver 1.0.0 is too old as well)
          # - serde_repr 0.1.0 (bollard-stubs, testcontainers) needs an older syn/quote
          # - thiserror 1.0.20 (openidconnect 4, id_effect_auth) is too old for its error derives
          # - yoke 0.6 sits next to zerovec from url / idna's ICU crates (no Yokeable impls)
          # - crc < 3.3: crc-fast 1.6 (object_store, id_effect_storage) needs CRC_64_REDIS
          # - ref-cast: fluent-uri 0.4.1 (jsonschema) needs `ref_cast_custom` / `RefCastCustom`
          for pin in crc32fast@1.1.0=1.4.2 semver@1.0.0=1.0.20 async-trait=0.1.89 \
            serde_repr=0.1.20 thiserror@1.0.20=1.0.69 yoke@0.6.0=0.7.5 crc=3.3.0 \
            ref-cast=1.0.27; do
            if cargo pkgid "${pin%%=*}" >/dev/null 2>&1; then
              cargo update -p "${pin%%=*}" --precise "${pin#*=}"
            else
              echo "minimal-versions pin ${pin%%=*}: not in the graph, skipped"
            fi
          done
          # (openssl/openssl-sys/metrics pins removed in 0.6: those crates now only appear in the
          # unpublished labs/ workspace, which this job does not build.)
      - name: cargo check (minimal versions, pinned toolchain)
        run: cargo +"$RUST_TOOLCHAIN" check --workspace --all-features
  # ──────────────────────────────────────────────────────────────────────────
  # crates.io packaging / publish-order (same script as publish.yml)
  # Catches path+version chicken-and-egg before a tag publish fails mid-wave.
  # ──────────────────────────────────────────────────────────────────────────
  validate-packaging:
    name: Validate crate packaging
    runs-on: ubuntu-latest
    needs: [moon-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (pinned, rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Validate crate packaging
        run: bash scripts/validate-crate-packaging.sh
  # ──────────────────────────────────────────────────────────────────────────
  # `id-effect new` templates: each one generated outside the repo against this
  # checkout (--local-workspace), then fmt / build / clippy / test; the service
  # is also built as a Docker image and probed on /health.
  # ──────────────────────────────────────────────────────────────────────────
  templates:
    name: Template ${{ matrix.template }}
    runs-on: ubuntu-latest
    needs: [moon-ci]
    strategy:
      fail-fast: false
      matrix:
        template: [service, worker, cli, cluster]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (pinned, rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: templates-${{ matrix.template }}
      - name: Generate, build and test the template
        env:
          TEMPLATE: ${{ matrix.template }}
          SMOKE_DIR: ${{ runner.temp }}/template-smoke
          # Inside ./target so the cache step keeps the generated projects' dependencies.
          SMOKE_TARGET_DIR: ${{ github.workspace }}/target/template-smoke
        run: |
          args=("$TEMPLATE")
          if [ "$TEMPLATE" = service ]; then args+=(--docker); fi
          bash scripts/template-smoke.sh "${args[@]}"
  # ──────────────────────────────────────────────────────────────────────────
  # HTTP/3 conformance (r12-e12-3-h3-server): example 092 serves TLS on TCP and HTTP/3 on UDP
  # (one port, self-signed `localhost`); h3spec (QUIC/HTTP/3 error cases, release binary checked
  # against its sha256) and curl --http3-only (quiche build, image pinned by digest) talk to it.
  # ──────────────────────────────────────────────────────────────────────────
  http3-conformance:
    name: HTTP/3 conformance (h3spec, curl --http3)
    runs-on: ubuntu-latest
    env:
      H3SPEC_VERSION: v0.1.14
      H3SPEC_SHA256: 7f2e3232715a3f6ff5212d408b2a3e74d6aa3ca06f96efca9a4e5dc55f3c6860
      # alpine/curl-http3 8.11.0 (BoringSSL + quiche; `Features: HTTP3`).
      CURL_HTTP3_IMAGE: alpine/curl-http3:8.11.0@sha256:b0cb55696adcaf5714958926a28ce78a5fa72f6a4aa8df2ec5b72f1cde8038e3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (pinned, rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: http3-conformance
      - name: Build example 092 and run its self-test (TCP + Alt-Svc, then HTTP/3)
        run: |
          cargo build --locked -p id_effect_axum --features http3 --example 092_http3
          target/debug/examples/092_http3 --self-test
      - name: Download h3spec (sha256-checked)
        run: |
          curl -fsSL -o h3spec \
            "https://github.com/kazu-yamamoto/h3spec/releases/download/${H3SPEC_VERSION}/h3spec-linux-x86_64"
          echo "${H3SPEC_SHA256}  h3spec" | sha256sum -c -
          chmod +x h3spec
      - name: Start example 092 on 127.0.0.1:8443
        run: |
          PORT=8443 target/debug/examples/092_http3 > server.log 2>&1 &
          for _ in $(seq 1 50); do
            if grep -q serving server.log; then exit 0; fi
            sleep 0.2
          done
          cat server.log
          exit 1
      # Report-only until 0.13 (follow-up F62): the first run failed 19 of 77 cases, half in our
      # h3 adapter (connection-specific headers, pseudo-header order), half in h3 0.0.8 and
      # quinn/rustls error codes. The round trip below stays a hard gate.
      - name: h3spec (report-only, F62)
        continue-on-error: true
        run: ./h3spec 127.0.0.1 8443 --no-validate
      - name: curl --http3-only and the Alt-Svc upgrade
        run: |
          set -euo pipefail
          curl3() {
            docker run --rm --network host "$CURL_HTTP3_IMAGE" \
              curl -sSfk --resolve localhost:8443:127.0.0.1 "$@"
          }
          test "$(curl3 --http3-only https://localhost:8443/version)" = "HTTP/3.0"
          curl3 --http2 -D - -o /dev/null https://localhost:8443/version \
            | grep -i '^alt-svc: h3=":8443"; ma=86400'
          test "$(curl3 --http3-only -I -o /dev/null -w '%{http_code} %{http_version}' \
            https://localhost:8443/hello)" = "200 3"
      - name: Server log
        if: always()
        run: cat server.log || true
  # ──────────────────────────────────────────────────────────────────────────
  # Supply-chain policy: advisories, licenses, bans, sources (deny.toml).
  # Checks the committed Cargo.lock (S5, D12).
  # ──────────────────────────────────────────────────────────────────────────
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (pinned, rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install cargo-deny
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check
      # D3 (0.10): id_effect_sql converts date-times itself, so neither sqlx's `time` feature nor
      # the `time` crate may come in through id_effect_sql / id_effect_kit (with both `time` and
      # `chrono`, sqlx's macros pick `time` for the application's own queries).
      - name: No sqlx `time` from id_effect_sql / id_effect_kit
        run: |
          kit=$(cargo tree --locked --color never -p id_effect_kit --all-features -e features -i sqlx)
          if grep -F 'feature "time"' <<<"$kit"; then
            echo "::error::sqlx's \`time\` feature is enabled under id_effect_kit --all-features"
            exit 1
          fi
          sql=$(cargo tree --locked --color never -p id_effect_sql --all-features -e normal -i time)
          if grep -E '^time v' <<<"$sql"; then
            echo "$sql"
            echo "::error::id_effect_sql --all-features depends on the \`time\` crate"
            exit 1
          fi
  # ──────────────────────────────────────────────────────────────────────────
  # Semver: publishable crates vs the latest release tag (docs/STABILITY.md).
  # REPORT-ONLY while a breaking 0.x release is in development: it may carry intentional
  # breaks, each of which must be listed in its migration guide; the job prints them for
  # review (PLAN-OF-PLANS §7.3 semver gate) but cannot fail CI.
  # Baseline = the highest release tag `vX.Y.Z` (no pre-release) not on this commit, built from
  # git (`--baseline-rev`, as the migration guide's semver section runs it), so a crate
  # promoted from labs/ is compared with the labs crate and no crates.io index is needed.
  # cargo-semver-checks is pinned: each release reads only a window of rustdoc JSON format
  # versions (0.47 cannot read Rust 1.99's; 0.51.0 is the release made for 1.99). Bump it
  # together with RUST_TOOLCHAIN; if no release reads the pinned toolchain's format yet, run this
  # job on the newest stable it reads instead (dtolnay/rust-toolchain with an explicit
  # `toolchain:`), since only the rustdoc JSON is compared.
  # ──────────────────────────────────────────────────────────────────────────
  semver:
    name: Semver checks (report-only, baseline latest release tag)
    runs-on: ubuntu-latest
    needs: [moon-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust (pinned, rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: semver
      - name: Install cargo-semver-checks (reads Rust 1.99 rustdoc JSON)
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-semver-checks@0.51.0
      - name: Baseline (latest release tag)
        run: |
          baseline=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --no-contains HEAD --sort=-v:refname \
            | grep -v -- - | head -n 1)
          if [ -z "$baseline" ]; then
            echo "::error::no release tag vX.Y.Z below HEAD"
            exit 1
          fi
          echo "Semver baseline: $baseline"
          echo "SEMVER_BASELINE=$baseline" >> "$GITHUB_ENV"
      - name: cargo semver-checks (publishable workspace crates)
        # --workspace skips publish = false members (examples). Step-level
        # continue-on-error keeps the job (and ci-pass) green while report-only.
        continue-on-error: true
        run: >-
          cargo semver-checks --workspace --baseline-rev "$SEMVER_BASELINE"
  # ──────────────────────────────────────────────────────────────────────────
  # Required status check gate
  # ──────────────────────────────────────────────────────────────────────────
  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    needs:
      - moon-ci
      - coverage
      - matrix
      - msrv
      - pg-integration
      - containers-integration
      - reference-ledger
      - reference-relay
      - rpc
      - labs
      - minimal-versions
      - validate-packaging
      - templates
      - deny
      - semver
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(echo "$results" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key
          ')
          if [ -n "$failed" ]; then
            echo "Failed jobs: $failed"
            exit 1
          fi
          echo "All required jobs passed"
