name: Docs & Pages
# API docs + mdBook are validated in CI (moon run :docs / :book on PRs via moon-ci).
# This workflow builds the combined site and deploys to Pages from main only.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  # Keep equal to rust-toolchain.toml's `channel` (S1).
  RUST_TOOLCHAIN: 1.99.0
  # Pinned releases, downloaded and checked against their sha256 (no `curl | bash`, S1).
  MOON_VERSION: 2.6.2
  MOON_SHA256: 103590c2a9e0894ec09ddce8462e4aa4b3d47debdf28a7d8ae8ccb60f84f3a08
  MDBOOK_VERSION: "0.4.43"
  MDBOOK_SHA256: d20c2f20eb1c117dc5ebeec120e2d2f6455c90fe8b4f21b7466625d8b67b9e60
# Least privilege (S2): the build job reads only; the deploy job is granted Pages below.
permissions:
  contents: read
jobs:
  build:
    name: Build book + API docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (pinned, rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install moon (pinned release, sha256-checked)
        run: |
          set -euo pipefail
          archive=moon_cli-x86_64-unknown-linux-gnu.tar.xz
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/moonrepo/moon/releases/download/v${MOON_VERSION}/$archive"
          echo "${MOON_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$HOME/.moon/bin"
          tar -xJf "$RUNNER_TEMP/$archive" -C "$HOME/.moon/bin" --strip-components=1 moon_cli-x86_64-unknown-linux-gnu/moon moon_cli-x86_64-unknown-linux-gnu/moonx
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install mdBook (pinned release, sha256-checked)
        run: |
          set -euo pipefail
          archive="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/$archive"
          echo "${MDBOOK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$HOME/.local/bin" mdbook
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync moon projects
        run: moon sync
        env:
          MOON_TOOLCHAIN_FORCE_GLOBALS: rust
      - name: Build API docs (cargo doc)
        run: moon run :docs
        env:
          MOON_TOOLCHAIN_FORCE_GLOBALS: rust
          RUSTDOCFLAGS: -D warnings
      - name: Build mdBook
        run: moon run :book
        env:
          MOON_TOOLCHAIN_FORCE_GLOBALS: rust
      - name: Assemble Pages site
        run: |
          mkdir -p site/api
          cp -r crates/id_effect/book/book/. site/
          cp -r target/doc/. site/api/
      - name: Upload Pages artefact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
