name: Publish to crates.io
# Trigger: push a signed semver tag, e.g.  git tag -s v0.11.0 -m v0.11.0 && git push origin v0.11.0
# The tag must match the version in every publishable Cargo.toml. docs/RELEASING.md has the flow.
#
#   verify-versions  versions match the tag; the tag is annotated and its signature verified (S6)
#   test             pre-publish tests
#   validate-packaging  publish order, path-only dev-deps, cargo package per crate
#   build            cargo package --locked of every published crate + one CycloneDX SBOM each
#   provenance       SLSA Build L3 provenance over those files (slsa-github-generator)
#   publish          cargo publish of the same tree in dependency order; skips versions already
#                    on crates.io, so a rerun after a partial publish resumes; checks each
#                    uploaded .crate against its attested sha256
#   verify           downloads every crate from crates.io: sha256 == attested digest, slsa-verifier
#   release          GitHub Release with the .crate files, SBOMs and the *.intoto.jsonl provenance
#
# crates.io auth: trusted publishing only (rust-lang/crates-io-auth-action exchanges the job's
# GitHub OIDC token for a crates.io token that lives 30 minutes). No registry secret is read (S3).
# Every crate must already exist on crates.io with this workflow as its trusted publisher; the
# publish plan refuses a release that contains a never-published crate (docs/RELEASING.md).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (package, attest and cargo publish --dry-run; nothing is uploaded)"
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # One toolchain for packaging and publishing: `cargo package` output is byte-for-byte the same
  # for the same tree and cargo, which is what lets publish upload the attested bytes.
  RUST_TOOLCHAIN: "1.99.0"
jobs:
  verify-versions:
    name: Verify versions and tag signature
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      dry-run: ${{ steps.version.outputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract version from tag or workspace
        id: version
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          else
            # Dry runs from a branch: members inherit version.workspace = true, so read the root.
            TAG=""
            VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)"/\1/')
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "dry-run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION (tag: ${TAG:-none}, dry run: $DRY_RUN)"
      - name: Require a signed tag (s6_release_requires_signed_tag)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          DRY_RUN: ${{ steps.version.outputs.dry-run }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run from a branch: no tag to check."
              exit 0
            fi
            echo "::error::A real publish runs from a signed v* tag (push the tag, or dispatch on the tag ref)."
            exit 1
          fi
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          if [ "${ref%% *}" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag; releases need a signed annotated tag (git tag -s)."
            exit 1
          fi
          verification=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/${ref#* }" --jq '(.verification.verified | tostring) + " " + .verification.reason')
          if [ "${verification%% *}" != "true" ]; then
            echo "::error::$TAG signature is not verified by GitHub (reason: ${verification#* }). Sign it with a key registered on the tagger's GitHub account."
            exit 1
          fi
          echo "$TAG is an annotated tag with a verified signature."
      - name: Check all crate versions match
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          MISMATCH=0
          # The workspace root is the single source of truth for the version.
          WS_VER=$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)"/\1/')
          if [ "$WS_VER" != "$VERSION" ]; then
            echo "MISMATCH: [workspace.package] version $WS_VER, expected $VERSION"
            MISMATCH=1
          fi
          # Every publishable member must inherit version.workspace = true so the
          # workspace bump propagates atomically. Excluded crates are skipped.
          for toml in crates/*/Cargo.toml; do
            CRATE=$(grep -m1 '^name = ' "$toml" | sed 's/^name = "\(.*\)"/\1/')
            if [ "$CRATE" = "id_effect_lint" ]; then
              continue
            fi
            if grep -q '^version.workspace = true' "$toml"; then
              continue
            fi
            CRATE_VER=$(grep -m1 '^version = ' "$toml" | sed 's/^version = "\(.*\)"/\1/')
            echo "MISMATCH: $toml ($CRATE) does not inherit version.workspace (found: ${CRATE_VER:-none})"
            MISMATCH=1
          done
          # The Dylint library is its own workspace (pinned nightly) with a literal version.
          LINTS_VER=$(grep -m1 '^version = ' lints/id_effect_lints/Cargo.toml | sed 's/^version = "\(.*\)"/\1/')
          if [ "$LINTS_VER" != "$VERSION" ]; then
            echo "MISMATCH: lints/id_effect_lints version $LINTS_VER, expected $VERSION"
            MISMATCH=1
          fi
          if [ "$MISMATCH" -eq 1 ]; then
            echo "Version mismatch detected — aborting publish."
            exit 1
          fi
          echo "All publishable crates are at version $VERSION"
  test:
    name: Pre-publish tests
    runs-on: ubuntu-latest
    needs: [verify-versions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest
      - name: cargo nextest run
        env:
          NEXTEST_NO_TESTS: pass
        run: cargo nextest run --workspace --locked
  validate-packaging:
    name: Validate crate packaging
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Validate all crates can package for publish
        run: ./scripts/validate-crate-packaging.sh
  # ──────────────────────────────────────────────────────────────────────────
  # Supply chain (D13): the build job packages every published crate and writes its SBOM; the
  # provenance job signs SLSA Build L3 provenance over exactly those files; publish uploads the
  # same tree and checks each uploaded .crate against the attested digest; verify re-downloads
  # every crate from crates.io and runs slsa-verifier. No cache in build or publish: nothing is
  # compiled (`--no-verify`; the test and validate-packaging jobs build), and a cache is an input
  # the provenance cannot describe.
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Package crates and SBOMs
    runs-on: ubuntu-latest
    needs: [verify-versions, validate-packaging]
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install the Dylint library's pinned nightly (lints/id_effect_lints/rust-toolchain.toml)
        working-directory: lints/id_effect_lints
        run: rustup toolchain install
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: cargo package --locked (every published crate, one invocation)
        # One invocation packages crates whose sibling dependencies are not on crates.io yet:
        # cargo resolves them from the packages it just built.
        run: |
          set -euo pipefail
          args=()
          for crate in $(./scripts/validate-crate-packaging.sh --print-order); do
            args+=(--package "$crate")
          done
          cargo package --locked --no-verify "${args[@]}"
          (cd lints/id_effect_lints && cargo package --locked --no-verify)
      - name: Generate CycloneDX SBOMs
        env:
          VERSION: ${{ needs.verify-versions.outputs.version }}
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --spec-version 1.5 --all-features --target all
          (cd lints/id_effect_lints && cargo cyclonedx --format json --spec-version 1.5 --all-features --target all)
          mkdir -p dist
          for crate in $(./scripts/validate-crate-packaging.sh --print-order); do
            mv "crates/$crate/$crate.cdx.json" "dist/$crate-$VERSION.cdx.json"
            cp "target/package/$crate-$VERSION.crate" dist/
          done
          mv lints/id_effect_lints/id_effect_lints.cdx.json "dist/id_effect_lints-$VERSION.cdx.json"
          cp "lints/id_effect_lints/target/package/id_effect_lints-$VERSION.crate" dist/
          ls -l dist
      - name: Subjects for the provenance (sha256sum, base64)
        id: hashes
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.crate *.cdx.json | tee ../SHA256SUMS
          echo "hashes=$(base64 -w0 < ../SHA256SUMS)" >> "$GITHUB_OUTPUT"
      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
  provenance:
    name: SLSA provenance
    needs: [verify-versions, build]
    permissions:
      actions: read # the generator reads the workflow run
      id-token: write # keyless Sigstore signing
      contents: write # declared by the generator's upload-assets job (unused: upload-assets is false)
    # Reusable workflows are referenced by tag, not SHA: the generator verifies its own ref and
    # rejects anything but @vX.Y.Z (slsa-github-generator README, "Referencing SLSA builders").
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      provenance-name: id_effect-${{ needs.verify-versions.outputs.version }}.intoto.jsonl
      upload-assets: false
  publish:
    name: Publish crates (dependency order)
    runs-on: ubuntu-latest
    needs: [verify-versions, build, provenance]
    environment: crates-io
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing (OIDC)
    env:
      VERSION: ${{ needs.verify-versions.outputs.version }}
      DRY_RUN: ${{ needs.verify-versions.outputs.dry-run }}
      SHA256SUMS: ${{ github.workspace }}/SHA256SUMS
      HASHES: ${{ needs.build.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install the Dylint library's pinned nightly
        working-directory: lints/id_effect_lints
        run: rustup toolchain install
      - name: Attested digests and publish plan (crates.io index, read-only)
        # Single source of truth for the order: scripts/validate-crate-packaging.sh.
        # Labs crates (publish = false, labs/ workspace) are never published (ADR 0010).
        run: |
          set -euo pipefail
          base64 -d <<<"$HASHES" > "$SHA256SUMS"
          for crate in $(./scripts/validate-crate-packaging.sh --print-order) id_effect_lints; do
            PLAN_ONLY=true .github/scripts/publish-crate.sh "$crate"
          done
      - name: Dry run (cargo publish --dry-run, one invocation)
        if: needs.verify-versions.outputs.dry-run == 'true'
        run: |
          set -euo pipefail
          args=()
          for crate in $(./scripts/validate-crate-packaging.sh --print-order); do
            args+=(--package "$crate")
          done
          cargo publish --dry-run --locked --no-verify "${args[@]}"
          (cd lints/id_effect_lints && cargo publish --dry-run --locked --no-verify)
          # The packages publish would upload (cargo leaves them in target/package/tmp-crate/)
          # are the attested ones: every .crate subject is checked.
          cp lints/id_effect_lints/target/package/tmp-crate/*.crate target/package/tmp-crate/
          grep '\.crate$' "$SHA256SUMS" > crates.sha256
          (cd target/package/tmp-crate && sha256sum --check --strict "$GITHUB_WORKSPACE/crates.sha256")
      # A trusted-publishing token lives 30 minutes, so each half of the order gets its own.
      - name: crates.io token (trusted publishing, first half)
        id: auth-1
        if: needs.verify-versions.outputs.dry-run != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish (first half of the order)
        if: needs.verify-versions.outputs.dry-run != 'true'
        env:
          CRATES_IO_TOKEN: ${{ steps.auth-1.outputs.token }}
        run: |
          set -euo pipefail
          for crate in $(./scripts/validate-crate-packaging.sh --print-order | sed -n '1,15p'); do
            echo "::group::publish $crate"
            .github/scripts/publish-crate.sh "$crate" --locked
            echo "::endgroup::"
          done
      - name: crates.io token (trusted publishing, second half)
        id: auth-2
        if: needs.verify-versions.outputs.dry-run != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish (second half of the order, then id_effect_lints)
        if: needs.verify-versions.outputs.dry-run != 'true'
        env:
          CRATES_IO_TOKEN: ${{ steps.auth-2.outputs.token }}
        run: |
          set -euo pipefail
          for crate in $(./scripts/validate-crate-packaging.sh --print-order | sed -n '16,$p'); do
            echo "::group::publish $crate"
            .github/scripts/publish-crate.sh "$crate" --locked
            echo "::endgroup::"
          done
          # The Dylint library builds with its own pinned nightly, after the workspace crates.
          echo "::group::publish id_effect_lints"
          (cd lints/id_effect_lints && "$GITHUB_WORKSPACE/.github/scripts/publish-crate.sh" id_effect_lints --locked)
          echo "::endgroup::"
  verify:
    name: Verify published crates against the provenance
    runs-on: ubuntu-latest
    needs: [verify-versions, build, provenance, publish]
    env:
      VERSION: ${{ needs.verify-versions.outputs.version }}
      TAG: ${{ needs.verify-versions.outputs.tag }}
      DRY_RUN: ${{ needs.verify-versions.outputs.dry-run }}
      PROVENANCE: provenance/${{ needs.provenance.outputs.provenance-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - name: Download the provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: provenance
      - name: Download the built crates (dry run only)
        if: needs.verify-versions.outputs.dry-run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Every crate on crates.io matches its attested digest (s5_attested_digest_matches_published_crate)
        # A dry run publishes nothing, so it checks the built files the same way.
        run: |
          set -euo pipefail
          # The subjects the signed provenance attests (DSSE payload -> in-toto statement).
          jq -r '.payload' "$PROVENANCE" | base64 -d | jq -r '.subject[] | "\(.digest.sha256)  \(.name)"' > attested.sha256
          cat attested.sha256
          source_args=(--source-uri "github.com/$GITHUB_REPOSITORY")
          if [ -n "$TAG" ]; then
            source_args+=(--source-tag "$TAG")
          fi
          mkdir -p downloaded
          failed=0
          for crate in $(./scripts/validate-crate-packaging.sh --print-order) id_effect_lints; do
            file="$crate-$VERSION.crate"
            if [ "$DRY_RUN" = "true" ]; then
              cp "dist/$file" "downloaded/$file"
            else
              curl -fsSL --retry 5 --retry-delay 10 -o "downloaded/$file" \
                "https://static.crates.io/crates/$crate/$file"
            fi
            expected=$(awk -v f="$file" '$2 == f { print $1 }' attested.sha256)
            actual=$(sha256sum "downloaded/$file" | cut -d' ' -f1)
            if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
              echo "::error::$file: sha256 $actual, attested ${expected:-<not a subject>}"
              failed=1
              continue
            fi
            if ! slsa-verifier verify-artifact "downloaded/$file" --provenance-path "$PROVENANCE" "${source_args[@]}"; then
              echo "::error::$file: slsa-verifier rejected the provenance"
              failed=1
            fi
          done
          exit "$failed"
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [verify-versions, provenance, verify]
    if: needs.verify-versions.outputs.dry-run != 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download SBOMs and .crate files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Download the provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: dist
      - name: Create GitHub Release
        # The provenance is a release asset so OpenSSF Scorecard's Signed-Releases check sees it.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.verify-versions.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/*.cdx.json
            dist/*.crate
            dist/*.intoto.jsonl
