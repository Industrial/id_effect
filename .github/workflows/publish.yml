name: Publish to crates.io
# Trigger: push a semver tag, e.g.  git tag v0.3.0 && git push --tags
# The tag must match the version in every publishable workspace Cargo.toml.
# Crates are published in strict dependency order (including optional path deps).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (pass --dry-run to cargo publish)"
        required: false
        default: "false"
        type: boolean
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
jobs:
  verify-versions:
    name: Verify Versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Extract version from tag or input
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            # Members inherit version.workspace = true, so read the workspace root.
            TAG=$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)"/\1/')
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $TAG"
      - name: Check all crate versions match
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MISMATCH=0
          # The workspace root is the single source of truth for the version.
          WS_VER=$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)"/\1/')
          if [ "$WS_VER" != "$VERSION" ]; then
            echo "MISMATCH: [workspace.package] version $WS_VER, expected $VERSION"
            MISMATCH=1
          fi
          # Every publishable member must inherit version.workspace = true so the
          # workspace bump propagates atomically. Excluded crates are skipped.
          for toml in crates/*/Cargo.toml; do
            CRATE=$(grep -m1 '^name = ' "$toml" | sed 's/^name = "\(.*\)"/\1/')
            if [ "$CRATE" = "id_effect_lint" ]; then
              continue
            fi
            if grep -q '^version.workspace = true' "$toml"; then
              continue
            fi
            CRATE_VER=$(grep -m1 '^version = ' "$toml" | sed 's/^version = "\(.*\)"/\1/')
            echo "MISMATCH: $toml ($CRATE) does not inherit version.workspace (found: ${CRATE_VER:-none})"
            MISMATCH=1
          done
          if [ "$MISMATCH" -eq 1 ]; then
            echo "Version mismatch detected — aborting publish."
            exit 1
          fi
          echo "All publishable crates inherit workspace version $VERSION"
  test:
    name: Pre-publish tests
    runs-on: ubuntu-latest
    needs: [verify-versions]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.86.5
        with:
          tool: cargo-nextest
      - name: cargo nextest run
        env:
          NEXTEST_NO_TESTS: pass
        run: cargo nextest run --workspace
  validate-packaging:
    name: Validate crate packaging
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Validate all crates can package for publish
        run: ./scripts/validate-crate-packaging.sh
  publish:
    name: Publish crates (dependency order)
    runs-on: ubuntu-latest
    needs: [validate-packaging]
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Publish in order
        # Single source of truth for the order: scripts/validate-crate-packaging.sh.
        # Labs crates (publish = false, labs/ workspace) are never published (ADR 0010).
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          for crate in $(./scripts/validate-crate-packaging.sh --print-order); do
            echo "::group::publish $crate"
            .github/scripts/publish-crate.sh "$crate"
            echo "::endgroup::"
            # Give the crates.io index time to see the crate before dependents publish.
            [ "$DRY_RUN" = "true" ] || sleep 25
          done
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.event_name == 'push' && inputs.dry_run != 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true
