# ──────────────────────────────────────────────────────────────────────────────
# I-02  A test's Exit must be matched, not .into_result().unwrap()-ed
# ──────────────────────────────────────────────────────────────────────────────
id: id_effect-run-test-result-must-be-matched
language: Rust
severity: warning
message: |
  `effect.block_on().into_result().unwrap()` hides whether the `Cause` was a typed
  failure, a defect or an interrupt. Match the `Exit` explicitly.
note: |
  BAD:  let result = my_effect().block_on().into_result().unwrap();
  GOOD: assert!(matches!(my_effect().block_on(), Exit::Success(_)));
rule:
  pattern: $EFF.block_on().into_result().unwrap()
