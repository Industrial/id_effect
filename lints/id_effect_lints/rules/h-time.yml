# ──────────────────────────────────────────────────────────────────────────────
# H-01  No thread::sleep in domain code
# ──────────────────────────────────────────────────────────────────────────────
id: id_effect-no-thread-sleep-in-domain
language: Rust
severity: error
message: |
  `std::thread::sleep` blocks the OS thread and starves the async runtime.
  Use `sleep(d)` or `Schedule`-based retry/repeat combinators on the executor clock.
note: |
  BAD:  thread::sleep(Duration::from_secs(5));
  GOOD: my_effect.retry(Schedule::spaced(Duration::from_secs(5)).take(3))
  GOOD: ~sleep(Duration::from_secs(5))   // inside effect!
rule:
  all:
    - any:
        - pattern: thread::sleep($$$)
        - pattern: std::thread::sleep($$$)
    - not:
        inside:
          matches: test-fn
          stopBy: end
---
# ──────────────────────────────────────────────────────────────────────────────
# H-01b  No thread::sleep in tests (use a TestExecutor's virtual clock)
# ──────────────────────────────────────────────────────────────────────────────
id: id_effect-no-thread-sleep-in-tests
language: Rust
severity: error
message: |
  `thread::sleep` in a test function makes the suite slow and non-deterministic.
  Run the effect on a `TestExecutor` and `advance(d)` its virtual clock.
note: |
  BAD:  #[test] fn my_test() { thread::sleep(Duration::from_millis(500)); … }
  GOOD: #[test] fn my_test() {
            // fork `my_effect()` on a `TestExecutor`, then:
            exec.advance(Duration::from_millis(500));
        }
rule:
  all:
    - any:
        - pattern: thread::sleep($$$)
        - pattern: std::thread::sleep($$$)
    - inside:
        matches: test-fn
        stopBy: end
---
# ──────────────────────────────────────────────────────────────────────────────
# H-02  No SystemTime::now() / Utc::now() in domain code
# ──────────────────────────────────────────────────────────────────────────────
id: id_effect-no-system-time-in-domain
language: Rust
severity: warning
message: |
  Direct time access (`SystemTime::now()`, `Utc::now()`, `Instant::now()`) in
  domain code is not testable and creates hidden side effects.
  Read time from the executor clock (virtual on a `TestExecutor`).
note: |
  BAD:  let now = SystemTime::now();
  GOOD: fn fetch_expiry() -> Effect<UtcDateTime> {
            effect!({ let now = ~UtcDateTime::now(); … })
        }
rule:
  any:
    - pattern: SystemTime::now()
    - pattern: Instant::now()
    - pattern: Utc::now()
    - pattern: Local::now()
    - pattern: chrono::Utc::now()
    - pattern: chrono::Local::now()
