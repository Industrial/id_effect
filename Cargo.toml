[workspace]
resolver = "2"
# labs/ is a separate workspace of unpublished crates (ADR 0010 Amendment 1).
exclude = [".tmp", "tmp", "labs"]
members = [
  "crates/id_effect",
  "crates/id_effect_axum",
  "crates/id_effect_cli",
  "crates/id_effect_config",
  "crates/id_effect_fp",
  "crates/id_effect_logger",
  "crates/id_effect_macro",
  "crates/id_effect_opentelemetry",
  "crates/id_effect_optics",
  "crates/id_effect_platform",
  "crates/id_effect_proc_macro",
  "crates/id_effect_process",
  "crates/id_effect_node",
  "crates/id_effect_resilience",
  "crates/id_effect_sql",
  "crates/id_effect_tokio",
  "crates/id_effect_fsm",
  "crates/id_effect_kit",
  "crates/id_effect_tool",
  "crates/id_effect_auth",
  "crates/id_effect_authz",
  "crates/id_effect_test",
  "crates/id_effect_redis",
  "crates/id_effect_jobs",
  "crates/id_effect_messaging",
  "crates/id_effect_mail",
  "crates/id_effect_console",
  "crates/id_effect_storage",
  "crates/id_effect_events",
  "crates/id_effect_workflow",
  # 0.12 (ADR 0010 Amendment 8): RPC moved out of labs, and its macro crate.
  "crates/id_effect_rpc",
  "crates/id_effect_rpc_macros",
  "examples/book-snippets",
  "examples/cli-minimal",
  "examples/http-showcase",
  "examples/reference/ledger",
  "examples/reference/relay",
  # Compile-fail security cases (ADR 0010 Amendment 7); publish = false.
  "tests/security_compile_fail",
]

[workspace.package]
version = "0.11.0"
edition = "2024"
# MSRV. Verified by the CI `msrv` job; bumping it is a deliberate, CHANGELOG-noted change.
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/Industrial/id_effect"

# More stable / comparable Criterion numbers than default bench profile (inherits release).
[profile.bench]
lto = "thin"
codegen-units = 1
