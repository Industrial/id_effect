# Root-level workspace tasks
# https://moonrepo.dev/docs/config/project
id: 'effect'
language: 'rust'
layer: 'application'
workspace:
  inheritedTasks:
    exclude:
      - check
      - clippy
      - test
tasks:
  format:
    description: 'Format the workspace with treefmt (Rust, Nix, shell, JS/TS, YAML, TOML)'
    command: 'bash'
    args: ['scripts/treefmt-moon.sh']
    inputs:
      - 'treefmt.toml'
      - '**/*.rs'
      - '**/*.nix'
      - '**/*.sh'
      - '**/*.{js,jsx,ts,tsx,json}'
      - '**/*.{yml,yaml}'
      - '**/*.toml'
      - '.github/workflows/*.yml'
      # Cargo/moon scratch — must not salt task hashes (esp. target/.rustc_info.json).
      - '!target/**/*'
      - '!**/.moon/cache/**/*'
      - '!**/node_modules/**/*'
    options:
      cache: false
      outputStyle: buffer-only-failure
  ci:
    description: 'Local/CI parity gate (mirrors .github/workflows/ci.yml moon-ci job)'
    command: 'bash'
    args: ['scripts/ci-local.sh', 'auto']
    options:
      cache: false
      outputStyle: buffer-only-failure
  ci-format:
    description: >-
      Repo-wide format *check* (treefmt CI mode + fail-on-change). Always runs (never cached): package :check/:clippy/:test/:build depend on it. Use :format to write formatted files.
    command: 'bash'
    args: ['scripts/treefmt-moon.sh', '--ci', '--config-file', 'treefmt.ci.toml']
    inputs:
      - 'treefmt.ci.toml'
      - '**/*.rs'
      - '**/*.nix'
      - '**/*.sh'
      - '**/*.{js,jsx,ts,tsx,json}'
      - '**/*.{yml,yaml}'
      - '**/*.toml'
      - '.github/workflows/*.yml'
      # Exclude build artifacts from the hash so dependents stay cacheable while
      # this task itself remains uncached (options.cache: false).
      - '!target/**/*'
      - '!**/.moon/cache/**/*'
      - '!**/node_modules/**/*'
    options:
      cache: false
      outputStyle: buffer-only-failure
  audit:
    description: 'Run cargo audit for known Rust security advisories'
    command: 'cargo'
    args: ['audit']
    inputs:
      - '.cargo/audit.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
    options:
      cache: false
      outputStyle: buffer-only-failure
  deny:
    description: 'Run cargo deny check (advisories, licenses, bans, sources; policy in deny.toml)'
    command: 'cargo'
    args: ['deny', 'check']
    inputs:
      - 'deny.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
    options:
      cache: false
      outputStyle: buffer-only-failure
  semver:
    description: >-
      Run cargo semver-checks for the publishable crates against the 0.7.0 crates.io baseline. Report-only in CI until v0.8.0 (see the semver job in ci.yml and docs/STABILITY.md).
    command: 'cargo'
    args: ['semver-checks', '--workspace', '--baseline-version', '0.7.0']
    inputs:
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - 'crates/**/*.rs'
    options:
      cache: false
      outputStyle: buffer-only-failure
  parity-checklist:
    description: 'Validate Effect.ts upstream parity checklist and UPSTREAM-VERSION pin'
    command: 'bash'
    args: ['scripts/parity-checklist.sh']
    inputs:
      - 'scripts/parity-checklist.sh'
      - 'docs/effect-ts-parity/CHECKLIST-upstream-effect.md'
      - 'docs/effect-ts-parity/UPSTREAM-VERSION'
    options:
      cache: true
      outputStyle: buffer-only-failure
  scorecard:
    description: 'Validate docs/scorecard/scorecard.json and reproduce METHOD §5.2 (scorecard self-test)'
    command: 'bash'
    args: ['scripts/scorecard.sh', '--validate', '--self-test']
    inputs:
      - 'scripts/scorecard.sh'
      - 'docs/scorecard/**/*'
    options:
      cache: true
      outputStyle: buffer-only-failure
  coverage:
    description: >-
      Full workspace: cargo llvm-cov nextest with 96% lines/regions/functions. The fixed exclude list (IGNORE_REGEX, with its justifications) lives in scripts/llvm-cov-nextest.sh; see TESTING.md.
    command: 'bash'
    args: ['scripts/llvm-cov-nextest.sh']
    deps: ['~:ci-format']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
      - 'scripts/llvm-cov-nextest.sh'
    options:
      cache: false
  build:
    description: 'Build the workspace with cargo'
    deps: ['~:ci-format', '^:build']
    command: 'cargo'
    args: ['build']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/*.rs'
    options:
      cache: true
      outputStyle: buffer-only-failure
  docs:
    description: 'Build Rust API documentation with cargo doc'
    command: 'cargo'
    args: ['doc', '--no-deps', '--workspace']
    env:
      # Match Docs & Pages (`RUSTDOCFLAGS: -D warnings`) so PR CI catches rustdoc failures.
      RUSTDOCFLAGS: '-D warnings'
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
    outputs:
      - 'target/doc'
    options:
      cache: true
      outputStyle: buffer-only-failure
  book:
    description: 'Build the Effect.rs mdBook HTML documentation'
    command: 'mdbook'
    args: ['build', 'crates/id_effect/book']
    inputs:
      - 'crates/id_effect/book/book.toml'
      - 'crates/id_effect/book/src/**/*'
    outputs:
      - 'crates/id_effect/book/book'
    options:
      cache: true
      outputStyle: buffer-only-failure
  fix:
    description: 'Auto-fix with cargo fix and clippy --fix'
    command: 'bash'
    args: ['-c', 'cargo fix --allow-dirty --allow-staged --workspace --all-features && cargo clippy --fix --allow-dirty --allow-staged --workspace --all-features -- -D warnings']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
    options:
      cache: false
      outputStyle: buffer-only-failure
  bench:
    description: 'Run benchmarks (no-op if no benches)'
    command: 'bash'
    args: ['-c', 'if [ -d benches ]; then cargo bench; else echo "No benches/ directory"; fi']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
      - 'benches/**/*'
    options:
      cache: false
      outputStyle: buffer-only-failure
  compile-time:
    description: >-
      Measure the template app build loop: cold build, incremental rebuild after a one-line change, and boot (median of 3; see docs/benchmarks/README.md). Manual only, not part of ci; run on an idle machine.
    command: 'bash'
    args: ['scripts/compile-time.sh', '--json']
    options:
      cache: false
      runInCI: false
      outputStyle: stream
  dx-kpis:
    description: >-
      Measure the DX KPIs and write docs/benchmarks/dx-kpis-<release>.json (DX_KPIS_RELEASE, default 0.9): K1 (id-effect new service to GET /health = 200, cold build, budget 180 s), K3 (added non-blank lines of the invoice patch for the Ledger app; --k3-build also builds and tests it), K4 (diagnostics gallery errors that state the fix, >= 17/20), K5 (book rust fences compiled as doctests, >= 80 %). Manual only, not part of ci; run on an idle machine with DX_KPIS_DIR on a large disk.
    command: 'bash'
    args: ['scripts/dx-kpis.sh', '--json']
    options:
      cache: false
      runInCI: false
      outputStyle: stream
  check-docs:
    description: 'Build docs with -D warnings (same bar as Docs & Pages)'
    command: 'bash'
    args: ['-c', 'RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps 2>&1 | tee log/docs-warnings.log | grep -E "(warning|error|Documenting|Finished)"']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
    options:
      cache: false
      outputStyle: buffer-only-failure
