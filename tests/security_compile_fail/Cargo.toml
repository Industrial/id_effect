[package]
name = "security_compile_fail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Never published (ADR 0010 Amendment 7): it holds the compile-fail cases of ADR 0013.
publish = false
description = "Compile-fail security cases for id_effect (ADR 0013): misuse that must not compile"
license.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lib]
path = "src/lib.rs"

[dev-dependencies]
# The cases under ui/ use the APIs through the kit, as an app would. `cluster` turns on
# id_effect_node's `tls-tcp` but not `insecure-plaintext-tcp` (r8_plaintext_tcp_without_feature).
id_effect_kit = { path = "../../crates/id_effect_kit", features = [
  "web",
  "sql",
  "cluster",
  "authz",
  "logger",
] }
# The 0.12 call-surface cases, directly until the kit's `rpc` / `http3` features land (wave 6):
# `#[rpc::service]` (r1_rpc_procedure_without_access_decision) and the HTTP/3 server options
# (r10_zero_rtt_on_mutation).
id_effect_rpc = { path = "../../crates/id_effect_rpc" }
id_effect_axum = { path = "../../crates/id_effect_axum", features = ["http3"] }
# `http::request::Parts` for the route guards of the H8 cases.
axum = "0.8"
# secret_is_not_serialize.
serde_json = "1"
trybuild = "1"

[package.metadata.id_effect]
# ADR 0010 crate tier — checked by scripts/tier-conformance.sh (ADR 0010 Amendment 7).
tier = "example"
